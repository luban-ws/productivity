作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0001: 青鸟(Qing Niao)通用发布工具设计规范\n> \n> **Status:** Draft\n> \n> - **开始日期**: 2025-01-XX\n> - **更新日期**: 2026-09-27\n> - **RFC PR**:\n> - **实现议题**:\n> - **作者**: AI Assistant\n> - **状态**: Draft\n> - **命名空间**: `@systembug/qingniao`\n> \n> ## Summary\n> \n> 本 RFC 设计一个通用的、可配置的发布工具——**青鸟(Qing Niao)**，用于自动化 monorepo 项目的版本管理、构建验证和 NPM 发布流程。该工具**完全零配置优先**，自动从 `package.json` 和 workspace 配置推断所有必要信息。**配置文件完全可选**，仅用于覆盖自动检测的结果，支持部分覆盖和深度定制。\n> \n> ## 青鸟哲学\n> \n> 青鸟是中国神话中西王母的信使，负责传递消息和物品到人间。发布工具青鸟体现这些原则：\n> \n> - **信使使命**：将代码包准确、及时地传递到 NPM 仓库\n> - **可靠传递**：确保版本同步、依赖正确、构建完整\n> - **优雅流程**：提供流畅的发布体验，如同青鸟优雅的飞行\n> - **智能导航**：自动处理依赖顺序、版本同步等复杂逻辑\n> \n> ## 动机\n> \n> 当前项目中的 `publish.mjs` 脚本存在以下问题：\n> \n> 1. **硬编码逻辑**：脚本中包含了大量项目特定的逻辑（如包名、构建路径、命令等）\n> 2. **难以重用**：无法直接用于其他项目，需要大量修改\n> 3. **配置分散**：配置信息散布在代码中，难以维护\n> 4. **扩展性差**：添加新功能或修改流程需要修改核心代码\n> \n> 通过设计一个基于配置的通用发布工具，可以：\n> \n> - **提高可重用性**：通过配置文件适配不同项目\n> - **降低维护成本**：配置与代码分离，易于更新\n> - **增强灵活性**：支持多种发布策略和工作流\n> - **改善开发体验**：统一的 CLI 接口和清晰的错误提示\n> \n> ## 设计目标\n> \n> 1. **配置驱动**：所有项目特定信息通过配置文件定义\n> 2. **可扩展性**：支持自定义钩子函数和插件系统\n> 3. **类型安全**：完整的 TypeScript 类型定义和配置验证\n> 4. **向后兼容**：支持现有项目的迁移路径\n> 5. **开发友好**：清晰的错误消息和详细的日志输出\n> \n> ## 详细设计\n> \n> ### 1. 包结构\n> \n> ```\n> @systembug/qingniao/\n> ├── package.json\n> ├── tsconfig.json\n> ├── src/\n> │   ├── index.ts                    # 主入口\n> │   ├── cli.ts                      # CLI 命令处理\n> │   ├── config/\n> │   │   ├── schema.ts               # 配置 Schema 定义\n> │   │   ├── loader.ts                # 配置加载器\n> │   │   └── validator.ts             # 配置验证器\n> │   ├── core/\n> │   │   ├── executor.ts              # 执行引擎\n> │   │   ├── hooks.ts                 # 钩子系统\n> │   │   └── context.ts               # 执行上下文\n> │   ├── stages/\n> │   │   ├── auth.ts                  # 认证检查\n> │   │   ├── git.ts                   # Git 状态检查\n> │   │   ├── version.ts               # 版本管理\n> │   │   ├── build.ts                 # 构建验证\n> │   │   └── publish.ts               # NPM 发布\n> │   ├── utils/\n> │   │   ├── exec.ts                  # 命令执行工具\n> │   │   ├── package.ts               # 包管理工具\n> │   │   └── logger.ts                # 日志工具\n> │   └── types.ts                     # 类型定义\n> ├── schemas/\n> │   └── config.schema.json           # JSON Schema 配置定义\n> └── README.md\n> ```\n> \n> 上面是设计树。代码里没有 `utils/logger.ts`，日志走 `ora` 和 `@systembug/diting`。执行器是 `core/executor.ts`，不是 `executor.tsx`。交互确认在 `utils/prompts.ts`（inquirer）。Ink 只用于 `doctor` 界面。\n> \n> ### 2. 配置系统\n> \n> #### 2.1 零配置模式（Zero Config）\n> \n> 青鸟支持**完全零配置**模式，自动从项目结构推断所有必要信息：\n> \n> **自动检测流程**：\n> \n> 1. **包管理器检测**\n> \n>     ```typescript\n>     // 优先级顺序：\n>     // 1. package.json 中的 packageManager 字段\n>     // 2. 检测 lockfile: pnpm-lock.yaml -> pnpm, yarn.lock -> yarn, package-lock.json -> npm\n>     // 3. 检测可执行文件: which pnpm/yarn/npm\n>     ```\n> \n> 2. **Workspace 类型检测**\n> \n>     ```typescript\n>     // pnpm workspace: 检测 pnpm-workspace.yaml\n>     // yarn workspace: 检测 package.json 中的 workspaces 字段\n>     // npm workspace: 检测 package.json 中的 workspaces 字段\n>     ```\n> \n> 3. **包发现（自动）**\n> \n>     ```typescript\n>     // pnpm: 使用 'pnpm list -r --depth -1 --json'\n>     // yarn: 使用 'yarn workspaces list --json'\n>     // npm: 使用 'npm ls --workspaces --json'\n>     // 自动过滤: private 包、examples、test 等\n>     ```\n> \n> 4. **构建命令推断**\n> \n>     ```typescript\n>     // 从 package.json scripts 自动推断：\n>     // - 检测是否有 'build' 脚本 -> 使用 'pnpm build' 或 'turbo build'\n>     // - 检测 turbo.json -> 使用 turbo 任务\n>     // - 检测是否有 'lint', 'test', 'typecheck' -> 自动添加到构建步骤\n>     ```\n> \n> 5. **版本策略检测**\n> \n>     ```typescript\n>     // 检测 .changeset 目录 -> 使用 changeset 策略\n>     // 否则使用 manual 策略（交互式选择）\n>     ```\n> \n> 6. **Turbo 集成（自动）**\n> \n>     ```typescript\n>     // 检测 turbo.json -> 自动使用 turbo 构建\n>     // 从 turbo.json 读取任务配置\n>     ```\n> \n> 7. **构建产物路径推断**\n> \n>     ```typescript\n>     // 自动检测每个包的构建产物：\n>     // 1. 检查 package.json 中的 main/module/types 字段\n>     // 2. 检查是否存在 dist/, build/, lib/ 目录\n>     // 3. 检查 turbo.json 中的 outputs 配置\n>     ```\n> \n> 8. **构建步骤自动生成**\n>     ```typescript\n>     // 从 package.json scripts 自动生成构建步骤：\n>     // - 如果有 'clean' -> 添加清理步骤\n>     // - 如果有 'install' 或检测到 lockfile -> 添加安装步骤\n>     // - 如果有 'lint' -> 添加代码检查步骤\n>     // - 如果有 'typecheck' -> 添加类型检查步骤\n>     // - 如果有 'test' -> 添加测试步骤\n>     // - 如果有 'build' -> 添加构建步骤\n>     ```\n> \n> **零配置示例**：\n> \n> ```bash\n> # 在 pnpm workspace 项目中，直接运行：\n> qingniao\n> \n> # 工具会自动：\n> # 1. 检测到 pnpm workspace（从 pnpm-workspace.yaml）\n> # 2. 发现所有非私有包（使用 pnpm list）\n> # 3. 从 package.json scripts 推断构建步骤\n> # 4. 检测到 turbo.json，使用 turbo 构建\n> # 5. 检测到 .changeset，使用 changeset 版本策略\n> # 6. 自动推断每个包的构建产物路径\n> ```\n> \n> **实际项目示例（zouwu-workflow）**：\n> \n> ```json\n> // package.json (根目录)\n> {\n>     \"name\": \"@zouwu-wf/zouwu-workflow\",\n>     \"packageManager\": \"pnpm@9.0.0\",\n>     \"scripts\": {\n>         \"build\": \"turbo run build\",\n>         \"test\": \"turbo run test\",\n>         \"lint\": \"turbo run lint\",\n>         \"typecheck\": \"turbo run typecheck\"\n>     }\n> }\n> ```\n> \n> ```yaml\n> # pnpm-workspace.yaml\n> packages:\n>     - \"packages/*\"\n>     - \"packages/@zouwu-wf/*\"\n> ```\n> \n> ```json\n> // turbo.json\n> {\n>     \"tasks\": {\n>         \"build\": {\n>             \"dependsOn\": [\"^build\"],\n>             \"outputs\": [\"dist/**\"]\n>         }\n>     }\n> }\n> ```\n> \n> **零配置自动生成的配置**：\n> \n> ```typescript\n> // 等价于以下配置（自动生成，无需手动编写）\n> {\n>   project: {\n>     name: \"@zouwu-wf/zouwu-workflow\",\n>     packageManager: \"pnpm\"\n>   },\n>   workspace: {\n>     enabled: true,\n>     autoDetect: true\n>   },\n>   packages: {\n>     usePnpmList: true,\n>     exclude: [\"**/examples/**\", \"**/test/**\"]\n>   },\n>   build: {\n>     useTurbo: true,\n>     turboTasks: [\"build\"],\n>     steps: [\n>       { name: \"安装依赖\", command: \"pnpm install --frozen-lockfile\" },\n>       { name: \"代码检查\", command: \"pnpm lint\" },\n>       { name: \"类型检查\", command: \"pnpm typecheck\" },\n>       { name: \"运行测试\", command: \"pnpm test\" },\n>       { name: \"构建\", command: \"turbo build\" }\n>     ],\n>     verifyArtifacts: [\n>       // 自动从每个包的 package.json 推断\n>       { package: \"@zouwu-wf/workflow\", path: \"packages/@zouwu-wf/workflow/dist\" },\n>       { package: \"@zouwu-wf/cli\", path: \"packages/@zouwu-wf/cli/dist\" },\n>       // ...\n>     ]\n>   },\n>   version: {\n>     strategy: \"changeset\" // 检测到 .changeset 目录\n>   }\n> }\n> ```\n> \n> **自动推断的配置映射**：\n> \n> | 检测项         | 来源                                               | 默认行为                                  |\n> | -------------- | -------------------------------------------------- | ----------------------------------------- |\n> | 包管理器       | `packageManager` 字段或 lockfile                   | 自动选择                                  |\n> | Workspace 类型 | `pnpm-workspace.yaml` 或 `package.json.workspaces` | 自动检测                                  |\n> | 包列表         | workspace 命令输出                                 | 过滤私有包和 examples                     |\n> | 构建命令       | `package.json.scripts`                             | 使用 `build`, `lint`, `test`, `typecheck` |\n> | Turbo 使用     | `turbo.json` 存在                                  | 自动使用 turbo 任务                       |\n> | 版本策略       | `.changeset` 目录                                  | changeset 或 manual                       |\n> | Git 分支       | 当前分支                                           | `main` 或 `master`                        |\n> | 标签前缀       | 无                                                 | `v`                                       |\n> \n> #### 2.2 配置文件格式（可选，用于覆盖自动检测）\n> \n> **配置文件是完全可选的**，仅用于覆盖自动检测的结果。如果项目符合标准结构，**完全不需要配置文件**。\n> \n> **配置文件的角色**：\n> \n> - 🎯 **覆盖自动检测**：当自动检测的结果不符合需求时，使用配置文件覆盖\n> - 🎯 **部分覆盖**：只需覆盖需要自定义的部分，其他保持自动检测\n> - 🎯 **深度定制**：支持完全自定义的复杂场景\n> \n> **配置文件格式**（支持多种格式）：\n> \n> - `qingniao.config.js` (JavaScript)\n> - `qingniao.config.mjs` (ES Module)\n> - `qingniao.config.ts` (TypeScript, 需要 ts-node)\n> - `qingniao.config.json` (JSON)\n> - `package.json` 中的 `qingniao` 字段\n> - 也支持旧名称 `publish.config.*`（向后兼容）\n> \n> **配置合并策略**：\n> \n> ```typescript\n> // 配置合并顺序（从低到高，后面的覆盖前面的）：\n> // 1. 零配置自动推断（基础配置）\n> // 2. package.json 中的 qingniao 字段（覆盖自动推断）\n> // 3. qingniao.config.* 文件（覆盖 package.json）\n> // 4. 命令行 --config 指定的文件（最高优先级）\n> \n> // 合并规则：\n> // - 对象字段：深度合并（deep merge）\n> // - 数组字段：完全替换（不合并）\n> // - 函数字段：完全替换\n> ```\n> \n> **配置文件优先级**（从高到低）：\n> \n> 1. 命令行 `--config` 指定的文件\n> 2. `qingniao.config.*` 文件\n> 3. `package.json` 中的 `qingniao` 字段\n> 4. **零配置自动推断**（默认，无需配置文件）\n> \n> **何时需要配置文件**：\n> \n> - ✅ **零配置足够（推荐）**：标准 monorepo 结构、使用常见工具（turbo、changeset）\n> - ⚙️ **需要配置文件（覆盖自动检测）**：\n>     - 覆盖自动检测的构建步骤\n>     - 覆盖自动检测的包过滤规则\n>     - 覆盖自动检测的版本策略\n>     - 覆盖自动检测的构建产物路径\n>     - 添加自定义钩子函数\n>     - 非标准的项目结构\n> \n> **部分覆盖示例**：\n> \n> ```typescript\n> // qingniao.config.ts\n> // 只覆盖构建步骤，其他保持自动检测\n> export default {\n>     build: {\n>         steps: [\n>             { name: \"自定义清理\", command: \"rm -rf dist\" },\n>             { name: \"自定义构建\", command: \"pnpm build:custom\" },\n>         ],\n>     },\n>     // 其他配置保持自动检测\n> };\n> ```\n> \n> ```json\n> // package.json\n> {\n>     \"qingniao\": {\n>         // 只覆盖 Git 分支配置\n>         \"git\": {\n>             \"branch\": \"develop\"\n>         }\n>         // 其他配置保持自动检测\n>     }\n> }\n> ```\n> \n> **零配置实现细节**：\n> \n> 1. **智能 Fallback 机制**\n> \n>     ```typescript\n>     // 如果自动检测失败，使用合理的默认值\n>     // 例如：如果检测不到 turbo.json，使用普通的构建命令\n>     // 如果检测不到 changeset，使用 manual 版本策略\n>     ```\n> \n> 2. **构建产物路径推断算法**\n> \n>     ```typescript\n>     // 优先级顺序：\n>     // 1. package.json 中的 main/module/types 字段的目录部分\n>     // 2. 检查常见目录：dist/, build/, lib/, out/\n>     // 3. turbo.json 中的 outputs 配置\n>     // 4. 如果都找不到，跳过验证（警告但不失败）\n>     ```\n> \n> 3. **构建步骤生成规则**\n> \n>     ```typescript\n>     // 自动生成的步骤顺序：\n>     // 1. clean（如果存在）- skipOnError: true\n>     // 2. install（如果检测到 lockfile 变化或不存在 node_modules）\n>     // 3. lint（如果存在）\n>     // 4. typecheck（如果存在）\n>     // 5. test（如果存在）\n>     // 6. build（必须存在，否则报错）\n>     ```\n> \n> 4. **包过滤规则（零配置）**\n>     ```typescript\n>     // 自动排除：\n>     // - private: true 的包\n>     // - 名称包含 'example', 'demo', 'test', 'sample' 的包\n>     // - 路径包含 /examples/, /demos/, /tests/ 的包\n>     // - 没有 version 字段的包\n>     ```\n> \n> #### 2.3 配置结构\n> \n> **所有配置字段都是可选的**，用于覆盖自动检测的结果。如果字段未提供，将使用自动检测的值。\n> \n> ```typescript\n> interface PublishConfig {\n>     // 项目元信息（可选，覆盖自动检测）\n>     project?: {\n>         name?: string; // 项目名称（默认: 从 package.json 读取）\n>         rootDir?: string; // 项目根目录（默认: process.cwd()）\n>         packageManager?: \"npm\" | \"pnpm\" | \"yarn\"; // 包管理器（默认: 自动检测）\n>     };\n> \n>     // Git 配置（可选，覆盖自动检测）\n>     git?: {\n>         enabled?: boolean; // 是否启用 Git 检查（默认: true，自动检测）\n>         branch?: string | string[]; // 允许的分支（默认: ['main', 'master']，自动检测当前分支）\n>         requireClean?: boolean; // 是否需要干净的工作区（默认: true）\n>         requireUpToDate?: boolean; // 是否需要与远程同步（默认: true）\n>         autoPull?: boolean; // 是否自动拉取更新（默认: true）\n>         tagPrefix?: string; // Git 标签前缀（默认: 'v'）\n>         commitMessage?: string | ((version: string) => string); // 提交消息模板（默认: 自动生成）\n>     };\n> \n>     // 版本管理配置（可选，覆盖自动检测）\n>     version?: {\n>         strategy?: \"changeset\" | \"manual\" | \"semver\" | \"custom\"; // 版本策略（默认: 自动检测 .changeset 目录）\n>         bumpTypes?: (\"major\" | \"minor\" | \"patch\")[]; // 允许的版本类型（manual 模式，默认: 全部）\n>         syncAll?: boolean; // 是否同步所有包的版本（默认: true）\n>         syncWorkspaceDeps?: boolean; // 是否同步 workspace 依赖的版本引用（默认: true）\n>         files?: string[]; // 需要更新版本的文件（默认: 自动检测所有 package.json）\n>     };\n> \n>     // Changeset 配置（可选，覆盖自动检测，当 strategy 为 'changeset' 时）\n>     changeset?: {\n>         enabled?: boolean; // 是否启用 changeset（默认: 自动检测 .changeset 目录）\n>         configPath?: string; // changeset 配置文件路径（默认: '.changeset/config.json'）\n>         createCommand?: string; // 创建 changeset 的命令（默认: 根据包管理器自动生成）\n>         versionCommand?: string; // 应用版本更新的命令（默认: 根据包管理器自动生成）\n>         publishCommand?: string; // 发布命令（默认: 根据包管理器自动生成）\n>         autoCreate?: boolean; // 如果没有 changeset 文件，是否自动创建（默认: false，交互式提示）\n>         skipVersion?: boolean; // 是否跳过版本更新步骤（默认: false）\n>         skipPublish?: boolean; // 是否跳过发布步骤（默认: false）\n>         readConfig?: boolean; // 是否读取 .changeset/config.json（默认: true）\n>     };\n> \n>     // 构建和验证配置（可选，覆盖自动检测）\n>     build?: {\n>         enabled?: boolean; // 是否启用构建检查（默认: true）\n>         steps?: BuildStep[]; // 构建步骤列表（默认: 从 package.json scripts 自动生成）\n>         verifyArtifacts?: ArtifactCheck[]; // 构建产物验证（默认: 从 package.json 和目录自动推断）\n>         useTurbo?: boolean; // 是否使用 Turbo（默认: 自动检测 turbo.json）\n>         turboConfigPath?: string; // Turbo 配置文件路径（默认: 'turbo.json'）\n>         turboTasks?: string[]; // 要执行的 Turbo 任务（默认: ['build']，从 turbo.json 读取）\n>         preLintBuild?: string[]; // 在 lint 之前构建特定包（如 eslint-plugin）（默认: []）\n>     };\n> \n>     // pnpm workspace 配置（可选，覆盖自动检测）\n>     workspace?: {\n>         enabled?: boolean; // 是否启用 workspace 模式（默认: 自动检测）\n>         configPath?: string; // workspace 配置文件路径（默认: 自动检测）\n>         autoDetect?: boolean; // 是否自动检测（默认: true）\n>     };\n> \n>     // 包发现配置（可选，覆盖自动检测）\n>     packages?: {\n>         root?: string; // 包根目录（默认: 从 workspace 配置自动检测）\n>         pattern?: string | string[]; // 包匹配模式（默认: 从 workspace 配置自动检测）\n>         exclude?: string[]; // 排除的包模式（默认: 自动排除 examples, test 等）\n>         filter?: (pkg: PackageInfo) => boolean; // 自定义过滤函数（默认: 自动过滤私有包）\n>         usePnpmList?: boolean; // 使用 workspace 命令发现包（默认: true，自动检测）\n>     };\n> \n>     // 依赖关系处理配置（可选，覆盖自动检测）\n>     dependencies?: {\n>         respectDependencyOrder?: boolean; // 是否考虑依赖顺序（默认: true）\n>         buildOrder?: \"topological\" | \"parallel\" | \"custom\"; // 构建顺序策略（默认: 'topological'）\n>         customOrder?: (packages: PackageInfo[]) => PackageInfo[]; // 自定义排序函数\n>     };\n> \n>     // NPM 发布配置（可选，覆盖自动检测）\n>     publish?: {\n>         enabled?: boolean; // 是否启用发布（默认: true）\n>         registry?: string; // NPM registry（默认: 自动检测 npm config）\n>         access?: \"public\" | \"restricted\"; // 发布访问级别（默认: 从 package.json 读取）\n>         dryRun?: boolean; // 是否仅执行 dry-run（默认: false）\n>         skipExisting?: boolean; // 是否跳过已存在的版本（默认: false）\n>         otpRequired?: boolean; // 是否需要 OTP（默认: 自动检测）\n>         replaceWorkspaceProtocols?: boolean; // 是否替换 workspace 协议（默认: true）\n>         protocolReplacement?: \"version\" | \"range\" | \"custom\"; // 替换策略（默认: 'version'）\n>         customProtocolReplacer?: (pkg: PackageInfo, dep: string) => string; // 自定义替换函数\n>     };\n> \n>     // 预发布检查配置（可选，覆盖自动检测）\n>     checks?: {\n>         auth?: boolean; // 检查 NPM 认证（默认: true）\n>         git?: boolean; // 检查 Git 状态（默认: true）\n>         build?: boolean; // 检查构建（默认: true）\n>         tests?: boolean; // 运行测试（默认: 从 package.json scripts 检测）\n>         lint?: boolean; // 代码检查（默认: 从 package.json scripts 检测）\n>         typecheck?: boolean; // 类型检查（默认: 从 package.json scripts 检测）\n>         format?: boolean; // 代码格式检查（默认: 从 package.json scripts 检测）\n>     };\n> \n>     // 钩子函数（可选，添加自定义逻辑）\n>     hooks?: {\n>         // 版本管理钩子\n>         beforeVersion?: (ctx: Context) => Promise\u003cvoid>;\n>         afterVersion?: (ctx: Context) => Promise\u003cvoid>;\n>         // Changeset 钩子\n>         beforeChangesetCreate?: (ctx: Context) => Promise\u003cvoid>;\n>         afterChangesetCreate?: (ctx: Context) => Promise\u003cvoid>;\n>         beforeChangesetVersion?: (ctx: Context) => Promise\u003cvoid>;\n>         afterChangesetVersion?: (ctx: Context) => Promise\u003cvoid>;\n>         beforeChangesetPublish?: (ctx: Context) => Promise\u003cvoid>;\n>         afterChangesetPublish?: (ctx: Context) => Promise\u003cvoid>;\n>         // 构建钩子\n>         beforeBuild?: (ctx: Context) => Promise\u003cvoid>;\n>         afterBuild?: (ctx: Context) => Promise\u003cvoid>;\n>         // 发布钩子\n>         beforePublish?: (ctx: Context) => Promise\u003cvoid>;\n>         afterPublish?: (ctx: Context) => Promise\u003cvoid>;\n>     };\n> \n>     // 交互式提示配置（可选，覆盖默认行为）\n>     prompts?: {\n>         confirmVersion?: boolean; // 是否确认版本更新（默认: true）\n>         confirmPublish?: boolean; // 是否确认发布（默认: true）\n>         dryRunFirst?: boolean; // 是否先执行 dry-run（默认: true）\n>     };\n> }\n> \n> // 构建步骤定义\n> interface BuildStep {\n>     name: string; // 步骤名称\n>     command: string; // 执行的命令\n>     cwd?: string; // 工作目录\n>     silent?: boolean; // 是否静默执行\n>     skipOnError?: boolean; // 错误时是否跳过\n>     condition?: (ctx: Context) => boolean; // 执行条件\n> }\n> \n> // 构建产物检查\n> interface ArtifactCheck {\n>     package: string; // 包名\n>     path: string; // 产物路径（相对于项目根目录）\n>     required?: boolean; // 是否必需（默认: true）\n>     minFiles?: number; // 最小文件数（默认: 1）\n> }\n> \n> // 包信息\n> interface PackageInfo {\n>     name: string;\n>     version: string;\n>     path: string;\n>     private?: boolean;\n> }\n> ```\n> \n> #### 2.4 配置示例\n> \n> **零配置（推荐，无需配置文件）**：\n> \n> ```bash\n> # 直接运行，完全依赖自动检测\n> qingniao\n> ```\n> \n> **最小配置示例（仅覆盖需要自定义的部分）**：\n> \n> ```json\n> // qingniao.config.json\n> // 只覆盖 Git 分支，其他全部自动检测\n> {\n>     \"git\": {\n>         \"branch\": \"develop\"\n>     }\n> }\n> ```\n> \n> ```json\n> // package.json\n> // 只覆盖构建步骤，其他保持自动检测\n> {\n>     \"qingniao\": {\n>         \"build\": {\n>             \"steps\": [{ \"name\": \"自定义构建\", \"command\": \"pnpm build:custom\" }]\n>         }\n>     }\n> }\n> ```\n> \n> **完整配置示例（JSON）**：\n> \n> ```json\n> {\n>     \"project\": {\n>         \"name\": \"Zouwu Workflow\"\n>     },\n>     \"git\": {\n>         \"branch\": \"main\"\n>     },\n>     \"version\": {\n>         \"strategy\": \"changeset\"\n>     },\n>     \"packages\": {\n>         \"pattern\": [\"packages/@zouwu-wf/*\"]\n>     },\n>     \"build\": {\n>         \"steps\": [\n>             { \"name\": \"安装依赖\", \"command\": \"pnpm install --frozen-lockfile\" },\n>             { \"name\": \"代码检查\", \"command\": \"pnpm lint\" },\n>             { \"name\": \"类型检查\", \"command\": \"pnpm typecheck\" },\n>             { \"name\": \"运行测试\", \"command\": \"pnpm test\" },\n>             { \"name\": \"构建\", \"command\": \"turbo build\" }\n>         ],\n>         \"verifyArtifacts\": [\n>             { \"package\": \"@zouwu-wf/workflow\", \"path\": \"packages/@zouwu-wf/workflow/dist\" },\n>             { \"package\": \"@zouwu-wf/cli\", \"path\": \"packages/@zouwu-wf/cli/dist\" }\n>         ]\n>     }\n> }\n> ```\n> \n> **高级配置（TypeScript，覆盖自动检测）**：\n> \n> ```typescript\n> import { PublishConfig } from \"@systembug/qingniao\";\n> \n> const config: PublishConfig = {\n>     // 以下配置覆盖自动检测的结果\n>     // 未配置的字段将使用自动检测的值\n> \n>     project: {\n>         name: \"Zouwu Workflow\", // 覆盖：默认从 package.json 读取\n>         packageManager: \"pnpm\", // 覆盖：默认自动检测\n>     },\n>     git: {\n>         branch: \"main\", // 覆盖：默认自动检测当前分支\n>         tagPrefix: \"v\", // 覆盖：默认 'v'\n>         commitMessage: (version) => `chore: release v${version}\\n\\n[skip ci]`, // 覆盖：默认自动生成\n>     },\n>     version: {\n>         strategy: \"changeset\", // 覆盖：默认自动检测 .changeset 目录\n>         syncAll: true, // 覆盖：默认 true\n>     },\n>     changeset: {\n>         versionCommand: \"pnpm changeset:version\", // 覆盖：默认根据包管理器自动生成\n>         publishCommand: \"pnpm changeset:publish\", // 覆盖：默认根据包管理器自动生成\n>     },\n>     build: {\n>         // 覆盖：默认从 package.json scripts 自动生成\n>         steps: [\n>             { name: \"清理\", command: \"pnpm clean\", skipOnError: true },\n>             { name: \"安装依赖\", command: \"pnpm install --frozen-lockfile\" },\n>             { name: \"代码检查\", command: \"pnpm lint\" },\n>             { name: \"类型检查\", command: \"pnpm typecheck\" },\n>             { name: \"测试\", command: \"pnpm test\" },\n>             { name: \"构建\", command: \"turbo build\" },\n>         ],\n>         // 覆盖：默认从 package.json 和目录自动推断\n>         verifyArtifacts: [\n>             { package: \"@zouwu-wf/workflow\", path: \"packages/@zouwu-wf/workflow/dist\" },\n>             { package: \"@zouwu-wf/cli\", path: \"packages/@zouwu-wf/cli/dist\" },\n>             {\n>                 package: \"@zouwu-wf/expression-parser\",\n>                 path: \"packages/@zouwu-wf/expression-parser/dist\",\n>             },\n>             { package: \"@zouwu-wf/logger\", path: \"packages/@zouwu-wf/logger/dist\" },\n>         ],\n>     },\n>     packages: {\n>         pattern: [\"packages/@zouwu-wf/*\"], // 覆盖：默认从 workspace 配置自动检测\n>         exclude: [\"**/examples/**\"], // 覆盖：默认自动排除\n>     },\n>     publish: {\n>         dryRun: false, // 覆盖：默认 false\n>         skipExisting: true, // 覆盖：默认 false\n>     },\n>     hooks: {\n>         // 添加自定义逻辑（零配置不支持）\n>         beforeVersion: async (ctx) => {\n>             console.log(`准备更新版本到 ${ctx.version}`);\n>         },\n>         afterPublish: async (ctx) => {\n>             console.log(`发布完成: ${ctx.version}`);\n>         },\n>     },\n>     // 注意：以下配置未提供，将使用自动检测的值：\n>     // - workspace: 自动检测 pnpm-workspace.yaml\n>     // - dependencies: 自动分析依赖关系\n>     // - checks: 自动从 package.json scripts 检测\n>     // - prompts: 使用默认值\n> };\n> \n> export default config;\n> ```\n> \n> **部分覆盖示例（推荐）**：\n> \n> ```typescript\n> // qingniao.config.ts\n> // 只覆盖需要自定义的部分，其他保持自动检测\n> export default {\n>     // 只覆盖 Git 分支配置\n>     git: {\n>         branch: \"develop\",\n>     },\n>     // 只覆盖构建步骤\n>     build: {\n>         steps: [{ name: \"自定义构建\", command: \"pnpm build:custom\" }],\n>     },\n>     // 其他所有配置保持自动检测\n> };\n> ```\n> \n> ### 3. pnpm Workspace 集成\n> \n> #### 3.1 自动检测\n> \n> 工具会自动检测 pnpm workspace 环境：\n> \n> 1. **检测 pnpm-workspace.yaml**：自动读取 workspace 配置\n> 2. **检测 packageManager 字段**：从 `package.json` 读取包管理器版本\n> 3. **检测 workspace 协议**：识别 `workspace:*` 依赖关系\n> \n> ```typescript\n> interface WorkspaceConfig {\n>     // pnpm workspace 配置\n>     workspace?: {\n>         enabled?: boolean; // 是否启用 workspace 模式（默认: 自动检测）\n>         configPath?: string; // workspace 配置文件路径（默认: 'pnpm-workspace.yaml'）\n>         autoDetect?: boolean; // 是否自动检测（默认: true）\n>     };\n> \n>     // 包发现增强（workspace 模式）\n>     packages?: {\n>         // 使用 pnpm 的包发现机制\n>         usePnpmList?: boolean; // 使用 'pnpm list -r --depth -1' 发现包（默认: true）\n>         // 或者使用自定义模式\n>         pattern?: string | string[]; // 包匹配模式（当 usePnpmList 为 false 时使用）\n>         exclude?: string[]; // 排除的包模式\n>         filter?: (pkg: PackageInfo) => boolean;\n>     };\n> \n>     // 依赖关系处理\n>     dependencies?: {\n>         respectDependencyOrder?: boolean; // 是否考虑依赖顺序（默认: true）\n>         buildOrder?: \"topological\" | \"parallel\" | \"custom\"; // 构建顺序策略\n>         customOrder?: (packages: PackageInfo[]) => PackageInfo[]; // 自定义排序函数\n>     };\n> }\n> ```\n> \n> #### 3.2 包发现机制\n> \n> 在 pnpm workspace 模式下，工具提供两种包发现方式：\n> \n> **方式 1：使用 pnpm 命令（推荐）**\n> \n> ```typescript\n> // 自动使用 pnpm list 发现所有 workspace 包\n> const packages = await execPnpmList();\n> // 等价于: pnpm list -r --depth -1 --json\n> ```\n> \n> **方式 2：使用配置模式**\n> \n> ```json\n> {\n>     \"packages\": {\n>         \"usePnpmList\": false,\n>         \"pattern\": [\"packages/*\", \"packages/@zouwu-wf/*\"],\n>         \"exclude\": [\"**/examples/**\", \"**/test/**\"]\n>     }\n> }\n> ```\n> \n> #### 3.3 依赖关系处理\n> \n> 工具会自动分析 workspace 依赖关系，确保正确的构建和发布顺序：\n> \n> ```typescript\n> // 示例：包依赖关系\n> // @zouwu-wf/cli -> @zouwu-wf/workflow -> @zouwu-wf/logger\n> //                -> @zouwu-wf/expression-parser\n> \n> // 拓扑排序后的构建顺序：\n> // 1. @zouwu-wf/logger (无依赖)\n> // 2. @zouwu-wf/expression-parser (无依赖)\n> // 3. @zouwu-wf/workflow (依赖 logger, expression-parser)\n> // 4. @zouwu-wf/cli (依赖 workflow)\n> ```\n> \n> **配置示例**：\n> \n> ```typescript\n> {\n>   dependencies: {\n>     respectDependencyOrder: true,      // 考虑依赖顺序\n>     buildOrder: 'topological',         // 拓扑排序\n>   },\n>   build: {\n>     steps: [\n>       // 工具会自动按依赖顺序构建包\n>       { name: '构建（按依赖顺序）', command: 'pnpm --filter \"./packages/**\" build' }\n>     ]\n>   }\n> }\n> ```\n> \n> #### 3.4 pnpm Filter 命令支持\n> \n> 工具提供便捷的 pnpm filter 命令封装：\n> \n> ```typescript\n> interface PnpmFilterConfig {\n>     // 使用 pnpm filter 执行命令\n>     useFilter?: boolean; // 是否使用 pnpm filter（默认: true）\n>     filterPattern?: string; // filter 模式\n>     recursive?: boolean; // 是否递归（默认: true）\n> }\n> \n> // 示例配置\n> {\n>     build: {\n>         steps: [\n>             {\n>                 name: \"构建特定包\",\n>                 command: \"pnpm --filter @zouwu-wf/workflow build\",\n>                 // 或者使用配置\n>                 pnpmFilter: {\n>                     pattern: \"@zouwu-wf/workflow\",\n>                     recursive: false,\n>                 },\n>             },\n>             {\n>                 name: \"构建所有包\",\n>                 command: \"turbo build\",\n>                 // 或者\n>                 pnpmFilter: {\n>                     pattern: \"./packages/**\",\n>                     recursive: true,\n>                 },\n>             },\n>         ];\n>     }\n> }\n> ```\n> \n> #### 3.5 Workspace 协议处理\n> \n> 工具会自动处理 `workspace:*` 协议，在发布前替换为实际版本号：\n> \n> ```typescript\n> // 发布前：package.json\n> {\n>   \"dependencies\": {\n>     \"@zouwu-wf/logger\": \"workspace:*\"\n>   }\n> }\n> \n> // 发布后：package.json（自动替换）\n> {\n>   \"dependencies\": {\n>     \"@zouwu-wf/logger\": \"^1.0.0\"\n>   }\n> }\n> ```\n> \n> **配置选项**：\n> \n> ```typescript\n> {\n>   publish: {\n>     replaceWorkspaceProtocols?: boolean; // 是否替换 workspace 协议（默认: true）\n>     protocolReplacement?: 'version' | 'range' | 'custom'; // 替换策略\n>     customProtocolReplacer?: (pkg: PackageInfo, dep: string) => string; // 自定义替换函数\n>   }\n> }\n> ```\n> \n> #### 3.6 版本同步策略\n> \n> 在 pnpm workspace 中，工具支持多种版本同步策略：\n> \n> ```typescript\n> {\n>   version: {\n>     strategy: 'changeset',\n>     syncAll: true,                      // 同步所有 workspace 包的版本\n>     syncWorkspaceDeps: true,             // 同步 workspace 依赖的版本引用\n>     // 例如：如果 @zouwu-wf/workflow 更新到 1.1.0\n>     // 所有依赖它的包中的 \"workspace:*\" 会被替换为 \"^1.1.0\"\n>   }\n> }\n> ```\n> \n> #### 3.7 完整配置示例（pnpm workspace）\n> \n> ```typescript\n> import { PublishConfig } from \"@systembug/qingniao\";\n> \n> const config: PublishConfig = {\n>     project: {\n>         name: \"Zouwu Workflow\",\n>         packageManager: \"pnpm\", // 明确指定 pnpm\n>     },\n> \n>     // pnpm workspace 配置\n>     workspace: {\n>         enabled: true, // 启用 workspace 模式\n>         autoDetect: true, // 自动检测\n>     },\n> \n>     // 包发现（使用 pnpm list）\n>     packages: {\n>         usePnpmList: true, // 使用 pnpm 命令发现包\n>         exclude: [\"**/examples/**\", \"**/test/**\"],\n>         filter: (pkg) => !pkg.private, // 只发布非私有包\n>     },\n> \n>     // 依赖关系处理\n>     dependencies: {\n>         respectDependencyOrder: true, // 考虑依赖顺序\n>         buildOrder: \"topological\", // 拓扑排序\n>     },\n> \n>     // Git 配置\n>     git: {\n>         branch: \"main\",\n>         tagPrefix: \"v\",\n>     },\n> \n>     // 版本管理\n>     version: {\n>         strategy: \"changeset\",\n>         syncAll: true, // 同步所有包版本\n>         syncWorkspaceDeps: true, // 同步 workspace 依赖\n>     },\n> \n>     // Changeset 配置\n>     changeset: {\n>         versionCommand: \"pnpm changeset:version\",\n>         publishCommand: \"pnpm changeset:publish\",\n>     },\n> \n>     // 构建配置\n>     build: {\n>         steps: [\n>             { name: \"清理\", command: \"pnpm clean\", skipOnError: true },\n>             { name: \"安装依赖\", command: \"pnpm install --frozen-lockfile\" },\n>             { name: \"代码检查\", command: \"pnpm lint\" },\n>             { name: \"类型检查\", command: \"pnpm typecheck\" },\n>             { name: \"测试\", command: \"pnpm test\" },\n>             // 使用 turbo 构建（自动处理依赖顺序）\n>             { name: \"构建\", command: \"turbo build\" },\n>         ],\n>         verifyArtifacts: [\n>             { package: \"@zouwu-wf/workflow\", path: \"packages/@zouwu-wf/workflow/dist\" },\n>             { package: \"@zouwu-wf/cli\", path: \"packages/@zouwu-wf/cli/dist\" },\n>             {\n>                 package: \"@zouwu-wf/expression-parser\",\n>                 path: \"packages/@zouwu-wf/expression-parser/dist\",\n>             },\n>             { package: \"@zouwu-wf/logger\", path: \"packages/@zouwu-wf/logger/dist\" },\n>         ],\n>     },\n> \n>     // 发布配置\n>     publish: {\n>         replaceWorkspaceProtocols: true, // 替换 workspace 协议\n>         protocolReplacement: \"version\", // 使用版本号替换\n>         skipExisting: true, // 跳过已存在的版本\n>     },\n> \n>     // 钩子函数\n>     hooks: {\n>         beforeVersion: async (ctx) => {\n>             // 确保所有 workspace 依赖已更新\n>             await syncWorkspaceDependencies(ctx);\n>         },\n>         afterPublish: async (ctx) => {\n>             console.log(`已发布 ${ctx.packages.length} 个包`);\n>         },\n>     },\n> };\n> \n> export default config;\n> ```\n> \n> #### 3.8 Changeset 深度集成\n> \n> 青鸟与 Changeset 深度集成，提供零配置的版本管理和发布流程。\n> \n> **自动检测 Changeset**：\n> \n> ```typescript\n> // 自动检测流程：\n> // 1. 检测 .changeset 目录是否存在\n> // 2. 检测 .changeset/config.json 配置文件\n> // 3. 检测 package.json 中的 changeset 相关脚本\n> // 4. 如果检测到，自动使用 changeset 版本策略\n> ```\n> \n> **零配置 Changeset 工作流**：\n> \n> ```bash\n> # 在包含 .changeset 目录的项目中，直接运行：\n> qingniao\n> \n> # 工具会自动：\n> # 1. 检测到 .changeset 目录\n> # 2. 使用 changeset 版本策略\n> # 3. 检查是否有未应用的 changeset 文件\n> # 4. 如果没有，提示创建 changeset\n> # 5. 应用 changeset 版本更新\n> # 6. 使用 changeset publish 发布\n> ```\n> \n> **Changeset 工作流程集成**：\n> \n> ```\n> 1. 检测 Changeset\n>    ├─ 检查 .changeset 目录\n>    ├─ 读取 .changeset/config.json\n>    └─ 检测 changeset 命令可用性\n> \n> 2. 检查 Changeset 文件\n>    ├─ 扫描 .changeset/*.md 文件（排除 README.md）\n>    ├─ 如果没有 changeset 文件：\n>    │  ├─ 提示创建 changeset\n>    │  ├─ 运行 changeset 命令（交互式）\n>    │  └─ 等待用户创建\n>    └─ 如果有 changeset 文件：继续流程\n> \n> 3. 应用版本更新\n>    ├─ 运行 changeset:version（或自动检测的命令）\n>    ├─ 更新所有包的版本号\n>    ├─ 更新 CHANGELOG.md（如果配置）\n>    └─ 清理已应用的 changeset 文件\n> \n> 4. 发布到 NPM\n>    ├─ 运行 changeset:publish\n>    ├─ 支持 OTP 交互式输入\n>    └─ 验证发布结果\n> ```\n> \n> **自动检测 Changeset 配置**：\n> \n> ```typescript\n> // 从 .changeset/config.json 自动读取：\n> interface ChangesetConfig {\n>     $schema?: string;\n>     changelog?: string | [string, any];\n>     commit?: boolean;\n>     fixed?: string[][];\n>     linked?: string[][];\n>     access?: \"public\" | \"restricted\";\n>     baseBranch?: string;\n>     updateInternalDependencies?: \"patch\" | \"minor\";\n>     ignore?: string[];\n> }\n> \n> // 青鸟会自动：\n> // - 读取 changelog 配置，决定是否生成 CHANGELOG\n> // - 读取 commit 配置，决定是否自动提交\n> // - 读取 access 配置，用于发布\n> // - 读取 baseBranch 配置，用于 Git 检查\n> ```\n> \n> **Changeset 命令自动生成**：\n> \n> ```typescript\n> // 根据包管理器自动生成命令：\n> // pnpm: 'pnpm changeset', 'pnpm changeset:version', 'pnpm changeset:publish'\n> // yarn: 'yarn changeset', 'yarn changeset version', 'yarn changeset publish'\n> // npm: 'npx changeset', 'npx changeset version', 'npx changeset publish'\n> \n> // 或者从 package.json scripts 检测：\n> // - 检测 'changeset' 脚本\n> // - 检测 'changeset:version' 或 'changeset version' 脚本\n> // - 检测 'changeset:publish' 或 'changeset publish' 脚本\n> ```\n> \n> **Changeset 配置覆盖**：\n> \n> ```typescript\n> // qingniao.config.ts\n> export default {\n>     version: {\n>         strategy: \"changeset\", // 明确指定使用 changeset\n>     },\n>     changeset: {\n>         // 覆盖自动检测的命令\n>         createCommand: \"pnpm changeset add\", // 覆盖默认命令\n>         versionCommand: \"pnpm changeset:version\",\n>         publishCommand: \"pnpm changeset:publish\",\n> \n>         // 覆盖自动检测的配置路径\n>         configPath: \".changeset/config.json\",\n> \n>         // 自定义 changeset 行为\n>         autoCreate: true, // 如果没有 changeset 文件，自动创建（非交互式）\n>         skipVersion: false, // 是否跳过版本更新步骤\n>     },\n> };\n> ```\n> \n> **Changeset 与 Git 集成**：\n> \n> ```typescript\n> // 青鸟自动处理：\n> // 1. 版本更新后，自动提交 changeset 相关文件\n> // 2. 根据 .changeset/config.json 的 commit 配置决定是否提交\n> // 3. 自动生成提交消息（如果未配置）\n> // 4. 创建 Git 标签\n> // 5. 推送到远程仓库\n> \n> // 示例提交消息（自动生成）：\n> // \"chore: release v1.0.0\\n\\n[skip ci]\"\n> // 或根据 changeset 配置：\n> // \"chore: version packages\"\n> ```\n> \n> **Changeset 与 CHANGELOG 集成**：\n> \n> ```typescript\n> // 青鸟自动处理：\n> // 1. 检测 .changeset/config.json 中的 changelog 配置\n> // 2. 如果配置了 changelog，自动更新 CHANGELOG.md\n> // 3. 在版本更新步骤中包含 CHANGELOG.md\n> // 4. 在 Git 提交中包含 CHANGELOG.md\n> ```\n> \n> **零配置 Changeset 示例**：\n> \n> ```bash\n> # 项目结构：\n> # .\n> # ├── .changeset/\n> # │   ├── config.json\n> # │   └── README.md\n> # ├── package.json\n> # ├── pnpm-workspace.yaml\n> # └── packages/\n> #     └── @zouwu-wf/\n> #         └── workflow/\n> \n> # 直接运行（零配置）：\n> qingniao\n> \n> # 等价于以下配置（自动生成）：\n> {\n>   version: {\n>     strategy: 'changeset'  // 自动检测到 .changeset 目录\n>   },\n>   changeset: {\n>     enabled: true,  // 自动检测\n>     createCommand: 'pnpm changeset',  // 根据 packageManager 自动生成\n>     versionCommand: 'pnpm changeset:version',\n>     publishCommand: 'pnpm changeset:publish'\n>   }\n> }\n> ```\n> \n> **Changeset 钩子集成**：\n> \n> ```typescript\n> // 青鸟提供 changeset 相关的钩子：\n> hooks: {\n>   beforeChangesetCreate: async (ctx) => {\n>     // changeset 创建前的钩子\n>     console.log('准备创建 changeset');\n>   },\n>   afterChangesetCreate: async (ctx) => {\n>     // changeset 创建后的钩子\n>     console.log('Changeset 已创建');\n>   },\n>   beforeChangesetVersion: async (ctx) => {\n>     // 版本更新前的钩子\n>     console.log('准备应用 changeset 版本更新');\n>   },\n>   afterChangesetVersion: async (ctx) => {\n>     // 版本更新后的钩子\n>     console.log(`版本已更新: ${ctx.version}`);\n>   },\n>   beforeChangesetPublish: async (ctx) => {\n>     // 发布前的钩子\n>     console.log('准备发布到 NPM');\n>   },\n>   afterChangesetPublish: async (ctx) => {\n>     // 发布后的钩子\n>     console.log('发布完成');\n>   }\n> }\n> ```\n> \n> **Changeset 错误处理**：\n> \n> ```typescript\n> // 青鸟自动处理常见错误：\n> // 1. 没有 changeset 文件：\n> //    - 提示创建 changeset\n> //    - 提供交互式创建选项\n> //    - 支持自动创建（如果配置）\n> \n> // 2. changeset 版本更新失败：\n> //    - 显示详细错误信息\n> //    - 提供恢复建议\n> //    - 支持重试\n> \n> // 3. changeset 发布失败：\n> //    - 检测 OTP 错误，提供提示\n> //    - 检测网络错误，提供重试建议\n> //    - 检测权限错误，提供解决步骤\n> ```\n> \n> **Changeset 与 Workspace 协议**：\n> \n> ```typescript\n> // 青鸟自动处理：\n> // 1. 在应用 changeset 版本更新后\n> // 2. 自动替换所有 workspace 协议为实际版本号\n> // 3. 确保发布的包使用正确的依赖版本\n> \n> // 例如：\n> // 发布前：@zouwu-wf/cli 依赖 @zouwu-wf/workflow: \"workspace:*\"\n> // 发布后：@zouwu-wf/cli 依赖 @zouwu-wf/workflow: \"^1.0.0\"\n> ```\n> \n> #### 3.10 Turbo 集成\n> \n> 如果项目使用 Turbo，工具会自动检测并利用 Turbo 的依赖图：\n> \n> ```typescript\n> {\n>   build: {\n>     // 自动检测 turbo.json\n>     useTurbo?: boolean;                  // 是否使用 Turbo（默认: 自动检测）\n>     turboConfigPath?: string;            // Turbo 配置文件路径\n>     turboTasks?: string[];               // 要执行的 Turbo 任务\n>   }\n> }\n> \n> // 示例\n> {\n>   build: {\n>     useTurbo: true,\n>     turboTasks: ['build', 'test'],      // 执行 build 和 test 任务\n>     // Turbo 会自动处理依赖顺序\n>   }\n> }\n> ```\n> \n> #### 3.11 工作流示例\n> \n> 完整的 pnpm workspace + Changeset 发布流程：\n> \n> ```\n> 1. 检测项目环境\n>    ├─ 检测 pnpm workspace（读取 pnpm-workspace.yaml）\n>    ├─ 检测 packageManager（从 package.json）\n>    ├─ 检测 Changeset（检查 .changeset 目录）\n>    ├─ 检测 Turbo（检查 turbo.json）\n>    └─ 验证项目结构\n> \n> 2. 发现包\n>    ├─ 执行 pnpm list -r --depth -1\n>    ├─ 解析包信息\n>    └─ 过滤私有包和排除项\n> \n> 3. 分析依赖关系\n>    ├─ 读取所有 package.json\n>    ├─ 构建依赖图\n>    └─ 拓扑排序\n> \n> 4. Changeset 检查（如果使用 changeset）\n>    ├─ 检查 .changeset/*.md 文件\n>    ├─ 如果没有 changeset 文件：\n>    │  ├─ 提示创建 changeset（交互式）\n>    │  ├─ 运行 changeset 命令\n>    │  └─ 等待用户创建\n>    └─ 如果有 changeset 文件：继续流程\n> \n> 5. 版本管理\n>    ├─ 如果使用 changeset：\n>    │  ├─ 运行 changeset:version\n>    │  ├─ 更新所有包版本\n>    │  ├─ 更新 CHANGELOG.md（如果配置）\n>    │  └─ 清理已应用的 changeset 文件\n>    └─ 如果使用 manual：\n>       ├─ 交互式选择版本类型\n>       └─ 手动更新版本号\n>    ├─ 替换 workspace 协议为实际版本\n>    └─ 同步依赖版本\n> \n> 6. Git 提交（如果配置）\n>    ├─ 添加版本相关文件\n>    ├─ 提交版本更新\n>    ├─ 创建 Git 标签\n>    └─ 推送到远程\n> \n> 7. 构建（按依赖顺序）\n>    ├─ 使用 Turbo 或 pnpm filter\n>    ├─ 确保依赖顺序正确\n>    └─ 验证构建产物\n> \n> 8. 发布到 NPM\n>    ├─ 如果使用 changeset：\n>    │  ├─ 运行 changeset:publish\n>    │  ├─ 支持 OTP 交互式输入\n>    │  └─ 验证发布结果\n>    └─ 如果使用其他策略：\n>       ├─ 按依赖顺序发布（先发布被依赖的包）\n>       ├─ 替换 workspace 协议为实际版本\n>       └─ 验证发布结果\n> ```\n> \n> ### 4. CLI 接口\n> \n> #### 4.1 命令结构\n> \n> ```bash\n> # 基础用法\n> qingniao [options]\n> # 或使用简短命令\n> qn [options]\n> \n> # 选项\n> --config, -c \u003cpath>        # 指定配置文件路径\n> --dry-run                  # 仅执行 dry-run\n> --skip-version             # 跳过版本更新\n> --skip-build               # 跳过构建检查\n> --skip-publish             # 跳过发布（仅执行版本更新和构建）\n> --yes, -y                  # 跳过所有确认提示\n> --verbose, -v              # 详细输出\n> --silent, -s               # 静默模式\n> ```\n> \n> #### 4.2 使用示例\n> \n> ```bash\n> # 使用默认配置\n> qingniao\n> # 或\n> qn\n> \n> # 使用自定义配置文件\n> qingniao --config ./qingniao.config.ts\n> # 或\n> qn -c ./qingniao.config.ts\n> \n> # 仅执行 dry-run\n> qingniao --dry-run\n> \n> # 跳过版本更新，仅发布\n> qingniao --skip-version\n> \n> # 非交互模式（CI/CD）\n> qingniao --yes\n> ```\n> \n> ### 5. 执行流程\n> \n> ```\n> 1. 加载配置\n>    ├─ 查找配置文件\n>    ├─ 验证配置格式\n>    └─ 合并默认值\n> \n> 2. 环境检查\n>    ├─ NPM 认证检查\n>    ├─ Git 状态检查\n>    └─ 远程同步检查\n> \n> 3. 版本管理（可选）\n>    ├─ 选择版本策略\n>    ├─ 更新版本号\n>    ├─ 提交到 Git\n>    ├─ 创建标签\n>    └─ 推送到远程\n> \n> 4. 构建验证（在版本更新之后，发布之前）\n>    ├─ 清理旧的构建产物（clean）\n>    ├─ 安装依赖（install）\n>    ├─ 在 lint 之前构建特定包（preLintBuild，可选）\n>    ├─ 代码质量检查（lint, format, typecheck, test）\n>    ├─ 执行构建步骤（build）\n>    └─ 验证构建产物（verifyArtifacts）\n> \n> 5. 发布准备\n>    ├─ 发现可发布的包\n>    ├─ 检查已存在的版本\n>    └─ 确认发布列表\n> \n> 6. 发布执行（不执行构建，只验证构建产物）\n>    ├─ 验证构建产物存在（不重新构建）\n>    ├─ Dry-run（可选）\n>    ├─ 正式发布\n>    └─ 验证发布结果\n> ```\n> \n> **重要流程说明**：\n> \n> - **构建阶段**：在版本更新之后、发布之前执行，包括清理、安装、检查、构建和验证\n> - **发布阶段**：不执行构建，只验证构建产物存在，然后发布\n> - **正确的流程顺序**：版本更新 → 构建（clean → build → verify）→ 发布（只验证，不构建）\n> \n> ### 6. 钩子系统\n> \n> 支持在关键节点执行自定义逻辑：\n> \n> ```typescript\n> interface Context {\n>   version?: string;                    // 当前版本\n>   packages: PackageInfo[];            // 可发布的包列表\n>   config: PublishConfig;               // 完整配置\n>   rootDir: string;                     // 项目根目录\n>   [key: string]: any;                  // 扩展字段\n> }\n> \n> // 钩子函数示例\n> hooks: {\n>   beforeVersion: async (ctx) => {\n>     // 版本更新前的自定义逻辑\n>     await updateChangelog(ctx.version);\n>   },\n>   afterPublish: async (ctx) => {\n>     // 发布后的通知逻辑\n>     await notifyTeam(ctx.packages);\n>   },\n> }\n> ```\n> \n> ### 7. 错误处理\n> \n> - **配置错误**：清晰的错误消息和配置验证提示\n> - **执行错误**：详细的错误堆栈和恢复建议\n> - **网络错误**：重试机制和超时处理\n> - **权限错误**：明确的权限要求和解决步骤\n> \n> ### 8. 日志和输出\n> \n> - **结构化日志**：使用 `@systembug/diting` 提供统一的日志系统，支持不同日志级别（debug, info, warn, error）\n> - **交互式 UI**：使用 `ora` 显示进度和状态，使用 `inquirer` 提供交互式提示\n> - **进度显示**：使用 `ora` spinner 显示任务进度和状态\n> - **彩色输出**：使用 `chalk` 提供友好的终端输出\n> - **静默模式**：支持 CI/CD 环境的静默执行（--yes 标志）\n> \n> ### 9. 交互式组件（基于 Inquirer）\n> \n> 青鸟使用 **inquirer** 作为交互框架，提供以下功能：\n> \n> 1. **确认对话框**：使用 `inquirer.prompt` 的 `confirm` 类型（Yes/No 选择）\n> 2. **选择列表**：使用 `inquirer.prompt` 的 `rawlist` 类型（多选项选择）\n> 3. **版本类型选择**：使用 `rawlist` 选择版本类型（major/minor/patch）\n> \n> 所有交互式提示都通过 `inquirer` 实现，确保一致的 CLI 体验。\n> \n> ## 实现状态\n> \n> 2026-09-27 对照 `packages/@systembug/qingniao/src` 改写。发布主路径已经能跑。下面「未接线」才是相对本 RFC 还没落地的部分。Agent 的 `plan --json` / `doctor --json` 属于 RFC 0006，不记在这里。\n> \n> ### 已落地\n> \n> - 包管理器：读 `packageManager` 字段和 lockfile（`utils/auto-detect.ts`）。没有 `which pnpm/yarn/npm` 回退。\n> - 包发现：`pnpm list -r`，或 `packages/` 目录模式（`utils/package.ts`）。`executor.ts` 在 workspace 开启时也只调 pnpm。\n> - 版本：manual、changeset、semver（`stages/version.ts`）。`version.files` 以及自动发现的 `skill-release.json`、`plugin.json` 会一起改版本（`stages/version-files.ts`）。\n> - Git：分支、干净工作区、未推送、远程拉取、提交、标签、推送（`stages/git.ts`）。\n> - 构建：配置的 steps、否则 Nx `run-many`、否则 turbo、否则 `run build`（`stages/build.ts`）。`preLintBuild` 在 `stages/verify.ts`。\n> - 发布：`npm`/`pnpm`/`yarn` publish、dry-run、`skipExisting`（`stages/publish.ts`）。认证读 whoami 和当前 registry，非 npmjs.org 只警告（`stages/auth.ts`、`core/executor.ts`）。\n> - 人机界面：inquirer + ora。Doctor 另有 Ink。\n> \n> ### 未接线\n> \n> 尚未接线的事项不写在本 RFC。每件一事，见伞 RFC [0007](0007-qingniao-publish-gaps.md) 的子 RFC。\n> \n> ## 迁移路径\n> \n> ### 从现有脚本迁移\n> \n> 1. **分析现有脚本**：提取硬编码的配置\n> 2. **创建配置文件**：将配置转换为标准格式\n> 3. **测试验证**：在测试环境验证配置\n> 4. **逐步替换**：替换现有脚本为新工具\n> \n> ### 迁移示例\n> \n> **原脚本中的硬编码**：\n> \n> ```javascript\n> // 硬编码的包列表\n> const builds = [\n>     [\"@wsxjs/wsx-core\", \"packages/core/dist\"],\n>     [\"@wsxjs/wsx-vite-plugin\", \"packages/vite-plugin/dist\"],\n> ];\n> ```\n> \n> **迁移到配置**：\n> \n> ```json\n> {\n>     \"build\": {\n>         \"verifyArtifacts\": [\n>             { \"package\": \"@wsxjs/wsx-core\", \"path\": \"packages/core/dist\" },\n>             { \"package\": \"@wsxjs/wsx-vite-plugin\", \"path\": \"packages/vite-plugin/dist\" }\n>         ]\n>     }\n> }\n> ```\n> \n> ## 优点\n> \n> 1. **零配置优先**：完全依赖 package.json 和 workspace 配置，开箱即用\n> 2. **可重用性**：通过配置适配不同项目，但零配置已覆盖大多数场景\n> 3. **可维护性**：配置与代码分离，易于更新；零配置无需维护\n> 4. **可扩展性**：支持钩子和插件机制，仅在需要时配置\n> 5. **类型安全**：完整的 TypeScript 支持\n> 6. **开发友好**：清晰的错误消息和文档；零配置降低使用门槛\n> 7. **智能推断**：自动检测项目结构、工具和配置，减少手动设置\n> \n> ## 缺点\n> \n> 1. **学习曲线**：需要理解配置结构\n> 2. **初始设置**：需要创建配置文件\n> 3. **抽象成本**：可能不如直接脚本灵活\n> \n> ## 考虑的替代方案\n> \n> 1. **保持现状**：继续使用硬编码脚本\n>     - 优点：简单直接\n>     - 缺点：难以重用和维护\n> \n> 2. **使用现有工具**：如 `changesets`、`lerna` 等\n>     - 优点：成熟稳定\n>     - 缺点：功能固定，难以定制\n> \n> 3. **模板系统**：提供脚本模板\n>     - 优点：简单易用\n>     - 缺点：仍需手动修改\n> \n> ## 后续工作\n> \n> 剩余事项在伞 RFC [0007](0007-qingniao-publish-gaps.md)。本 RFC 不再追加第二件工作。\n> \n> ## 参考文献\n> \n> - [Changesets](https://github.com/changesets/changesets)\n> - [Lerna](https://lerna.js.org/)\n> - [Semantic Versioning](https://semver.org/)\n> - [Turbo](https://turbo.build/)\n> \n> ## 变更日志\n> \n> - **2025-01-XX**: 初始版本，定义通用发布工具设计规范\n> - **2026-09-27**: 标题改为 RFC 0001。实现状态按当前源码重写。未接线事项拆到伞 RFC 0007，每件一事。"},"directory-9":{"body":"# .spec/rfc/completed\n\n## 本目录来源 / Local sources\n\n- .spec/rfc/completed/0002-wenxin-api-doc-generator.md · 0 条已整理规则\n\n- .spec/rfc/completed/0003-tongyu-cli-locale-package.md · 0 条已整理规则\n\n- .spec/rfc/completed/0006-qingniao-agent-cli-protocol.md · 0 条已整理规则\n\n- .spec/rfc/completed/0022-run-registry-login.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 4 条已整理规则\n  保护用户暂存工作：执行可能改变 Git 工作区或暂存区的操作前（conditional）\n  RFC 状态反映实际进度：更新 RFC 状态或归档 RFC 时（conditional）\n  测试结论必须附证据：报告测试结果时（conditional）\n  先查根因再修复：处理错误或行为异常时（conditional）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 2 份来源。部分审阅：根目录通用协作、测试声明、RFC 状态规则，以及 UI 技能的适用条件。RFC 正文作为参考资料，不纳入约束图；其余目录级规则与引用缺口未完成语义审阅。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-5":{"body":"# .spec/rfc/completed/0002-wenxin-api-doc-generator.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0002: 文心(Wen Xin)通用 API 文档生成工具设计规范\n> \n> **Status:** Implemented\n> \n> - **开始日期**: 2025-01-XX\n> - **更新日期**: 2025-01-XX\n> - **RFC PR**:\n> - **实现议题**:\n> - **作者**: AI Assistant\n> - **状态**: Implemented\n> - **命名空间**: `@systembug/wenxin`\n> \n> ## 摘要\n> \n> 本 RFC 设计一个通用的 API 文档生成工具——**文心(Wen Xin)**，支持 JSDoc 和 TypeScript 文档生成。该工具将原有的项目特定 JSDoc 工具通用化，支持配置化、TypeScript 类型提取，以及混合模式文档生成。工具遵循**零配置优先**原则，自动从项目结构推断配置，同时支持完整的配置定制。\n> \n> ## 文心哲学\n> \n> 文心雕龙是中国古代文学理论著作，强调文章的精雕细琢。文档生成工具文心体现这些原则：\n> \n> - **雕琢文档之美**：精心生成清晰、完整的 API 文档\n> - **兼容并蓄**：同时支持 JSDoc 注释和 TypeScript 类型系统\n> - **智能融合**：自动合并类型信息与注释，提供最佳文档体验\n> - **灵活配置**：支持零配置使用，也支持深度定制\n> \n> ## 动机\n> \n> 项目中存在一个项目特定的 JSDoc 工具（`@systembug/tools`），存在以下问题：\n> \n> 1. **硬编码路径**：配置文件中的路径是硬编码的，无法在不同项目间复用\n> 2. **功能单一**：仅支持 JSDoc，无法充分利用 TypeScript 类型系统\n> 3. **缺乏验证**：配置文件没有 schema 验证，容易出错\n> 4. **使用不便**：缺少 CLI 工具和初始化命令\n> \n> 通过设计一个通用的文档生成工具，可以：\n> \n> - **提高可重用性**：通过配置化支持不同项目结构\n> - **增强功能**：集成 TypeScript 类型提取，提供更完整的文档\n> - **改善体验**：提供 CLI 工具、配置验证和初始化命令\n> - **向后兼容**：保留原有 JSDoc 工具的所有功能\n> \n> ## 设计目标\n> \n> 1. **通用化**：支持任意项目的文档生成，不依赖特定项目结构\n> 2. **类型支持**：充分利用 TypeScript 类型系统，自动提取类型信息\n> 3. **混合模式**：支持 JSDoc、TypeDoc 和混合模式\n> 4. **配置验证**：使用 JSON Schema 验证配置文件\n> 5. **零配置优先**：自动检测项目结构，提供合理的默认配置\n> 6. **开发友好**：清晰的 CLI 接口、错误提示和文档\n> \n> ## 详细设计\n> \n> ### 1. 包结构\n> \n> ```\n> @systembug/wenxin/\n> ├── package.json\n> ├── tsconfig.json\n> ├── vite.config.ts\n> ├── src/\n> │   ├── index.ts                    # 主入口，导出 API\n> │   ├── cli.ts                      # CLI 命令处理\n> │   ├── config.ts                   # 配置管理（加载、合并、验证）\n> │   ├── jsdoc-processor.ts          # JSDoc 处理器\n> │   ├── typescript-processor.ts     # TypeScript 类型提取\n> │   ├── merger.ts                   # 类型与注释合并器\n> │   ├── types.ts                    # TypeScript 类型定义\n> │   └── commands/\n> │       └── init.ts                 # 初始化命令实现\n> ├── schemas/\n> │   └── config.schema.json          # JSON Schema 配置定义\n> ├── jsdoc-template/                 # JSDoc 模板（保留原有）\n> │   ├── publish.js\n> │   ├── tmpl/\n> │   └── static/\n> ├── jsdoc-aliases.js                # JSDoc 插件（保留原有）\n> ├── jsdoc-conf.json                 # 示例配置文件\n> └── README.md\n> ```\n> \n> ### 2. 配置系统\n> \n> #### 2.1 零配置模式（Zero Config）\n> \n> 文心支持**完全零配置**模式，自动从项目结构推断所有必要信息：\n> \n> **自动检测流程**：\n> \n> 1. **项目类型检测**\n> \n>     ```typescript\n>     // 检测 TypeScript/JavaScript\n>     // 1. 检查 tsconfig.json 存在 -> TypeScript\n>     // 2. 检查 package.json 中的 type 字段\n>     // 3. 默认 JavaScript\n>     ```\n> \n> 2. **源文件目录检测**\n> \n>     ```typescript\n>     // 优先级顺序：\n>     // 1. src/\n>     // 2. lib/\n>     // 3. source/\n>     // 4. 默认 src/\n>     ```\n> \n> 3. **入口文件检测**\n>     ```typescript\n>     // 检测可能的入口文件：\n>     // - src/index.ts\n>     // - src/index.js\n>     // - src/main.ts\n>     // - src/main.js\n>     // - index.ts\n>     // - index.js\n>     ```\n> \n> #### 2.2 配置文件格式\n> \n> 支持三种配置文件格式：\n> \n> 1. **JSON** (`wenxin.config.json`) - 推荐，支持 schema 验证\n> 2. **JavaScript** (`wenxin.config.js`) - 支持动态配置\n> 3. **TypeScript** (`wenxin.config.ts`) - 类型安全\n> \n> #### 2.3 配置 Schema\n> \n> 使用 JSON Schema 进行配置验证：\n> \n> ```json\n> {\n>   \"$schema\": \"./node_modules/@systembug/wenxin/schemas/config.schema.json\",\n>   \"mode\": \"hybrid\",\n>   \"jsdoc\": { ... },\n>   \"typedoc\": { ... }\n> }\n> ```\n> \n> ### 3. 核心功能\n> \n> #### 3.1 文档生成模式\n> \n> 支持三种模式：\n> \n> 1. **jsdoc 模式**：仅使用 JSDoc 生成文档\n>     - 适合纯 JavaScript 项目\n>     - 或只需要注释文档的场景\n> \n> 2. **typedoc 模式**：仅使用 TypeDoc 生成文档\n>     - 充分利用 TypeScript 类型系统\n>     - 自动提取类型信息\n> \n> 3. **hybrid 模式**（推荐）：同时使用 JSDoc 和 TypeDoc\n>     - 合并类型信息到 JSDoc 文档\n>     - 提供最完整的文档体验\n> \n> #### 3.2 JSDoc 处理\n> \n> 文心使用 JSDoc 模板系统生成文档：\n> \n> - **模板系统**：使用 `jsdoc-template/` 目录中的模板\n>     - `publish.js`：模板发布器（JSDoc 标准接口）\n>     - `tmpl/`：Underscore Template 模板文件（`.tmpl`）\n>     - `static/`：静态资源（CSS、JavaScript）\n> - **插件系统**：支持自定义插件（保留原有的 aliases 和 category 插件）\n> - **Markdown 解析**：支持在注释中使用 Markdown\n> - **配置化**：所有路径和选项均可配置\n> \n> #### 3.3 TypeScript 类型提取\n> \n> 文心使用 TypeDoc 提取 TypeScript 类型信息：\n> \n> - **TypeDoc 集成**：使用 TypeDoc Application API 进行类型提取\n> - **主题系统**：支持 TypeDoc 默认主题和自定义主题\n> - **配置选项**：支持排除私有/受保护/内部成员\n> - **入口文件**：可配置多个入口点\n> \n> #### 3.4 混合模式文档生成\n> \n> 在 **hybrid 模式**下，文心同时使用 JSDoc 和 TypeDoc 生成完整的 API 文档：\n> \n> **工作流程**：\n> \n> 1. **JSDoc 阶段**：解析源代码，提取 JSDoc 注释，生成 doclets\n> 2. **TypeDoc 阶段**：解析 TypeScript 类型，提取类型信息\n> 3. **类型合并**：将 TypeScript 类型信息合并到 JSDoc 注释中\n>     - 如果 JSDoc 中没有类型信息，使用 TypeScript 类型\n>     - 如果 JSDoc 中没有参数类型，使用 TypeScript 参数类型\n>     - 如果 JSDoc 中没有返回类型，使用 TypeScript 返回类型\n> 4. **文档生成**：使用合并后的数据生成最终文档\n> \n> **输出结构**：\n> \n> - JSDoc 生成的 HTML 文档（使用自定义模板）\n> - TypeDoc 生成的类型文档（可选，用于类型参考）\n> - 合并后的完整 API 文档\n> \n> ### 4. CLI 接口\n> \n> #### 4.1 主命令\n> \n> ```bash\n> wenxin [options]\n> wx [options]  # 短命令\n> ```\n> \n> **选项**：\n> \n> - `-c, --config \u003cpath>`: 指定配置文件路径\n> - `-m, --mode \u003cmode>`: 文档生成模式 (jsdoc|typedoc|hybrid)\n> - `-o, --output \u003cdir>`: 输出目录\n> - `--jsdoc-only`: 仅使用 JSDoc\n> - `--typedoc-only`: 仅使用 TypeDoc\n> - `--no-merge`: 不合并类型信息\n> \n> #### 4.2 子命令\n> \n> **init**: 生成配置文件模板\n> \n> ```bash\n> wenxin init [options]\n> ```\n> \n> **选项**：\n> \n> - `-f, --force`: 强制覆盖已存在的配置文件\n> - `--format \u003cformat>`: 配置文件格式 (ts|js|json)，默认 json\n> \n> **config**: 显示默认配置\n> \n> ```bash\n> wenxin config\n> ```\n> \n> ### 5. 配置接口\n> \n> #### 5.1 TypeScript 类型定义\n> \n> ```typescript\n> interface ApiDocConfig {\n>     mode?: \"jsdoc\" | \"typedoc\" | \"hybrid\";\n>     mergeTypes?: boolean;\n>     cwd?: string;\n>     jsdoc?: Partial\u003cJSDocOptions>;\n>     typedoc?: Partial\u003cTypeDocOptions>;\n> }\n> ```\n> \n> #### 5.2 编程式 API\n> \n> ```typescript\n> import { generateDocs } from \"@systembug/wenxin\";\n> \n> // 使用默认配置\n> await generateDocs();\n> \n> // 使用自定义配置\n> await generateDocs(\"wenxin.config.json\", {\n>     mode: \"hybrid\",\n>     jsdoc: {\n>         enabled: true,\n>         opts: {\n>             destination: \"./docs\",\n>         },\n>     },\n> });\n> ```\n> \n> ### 6. 模板系统设计\n> \n> #### 6.1 当前实现（JSDoc 标准模板）\n> \n> 当前使用 JSDoc 标准的模板系统：\n> \n> - **publish.js**：CommonJS 模块，实现 `exports.publish()` 接口\n> - **Underscore Template**：使用 `.tmpl` 文件，语法为 `\u003c?js= variable ?>`\n> - **TaffyDB**：内存数据库，存储和查询 doclets\n> \n> **问题**：\n> \n> - `publish.js` 设计复杂，难以维护\n> - Underscore Template 语法不够直观\n> - 模板逻辑与数据混合，难以分离\n> \n> #### 6.2 改进方案：基于 DSL 的模板系统\n> \n> 为了解决上述问题，文心将引入一个**基于 DSL 的模板定义系统**：\n> \n> **设计目标**：\n> \n> 1. **声明式配置**：使用 YAML/JSON 定义模板结构，而非命令式代码\n> 2. **逻辑分离**：将模板逻辑与数据分离，提高可维护性\n> 3. **类型安全**：提供 TypeScript 类型定义，确保配置正确性\n> 4. **向后兼容**：保留对现有 JSDoc 模板的支持\n> \n> **DSL 设计**：\n> \n> ```yaml\n> # wenxin-template.yaml\n> template:\n>     name: \"文心默认模板\"\n>     version: \"1.0.0\"\n> \n>     # 页面布局\n>     layout:\n>         html:\n>             head:\n>                 title: \"{{title}} - API 文档\"\n>                 stylesheets:\n>                     - \"styles/default.css\"\n>                     - \"styles/custom.css\"\n>                 scripts:\n>                     - \"scripts/highlight.js\"\n>             body:\n>                 header:\n>                     title: \"{{project.name}}\"\n>                     nav: \"{{navigation}}\"\n>                 main:\n>                     content: \"{{content}}\"\n>                 footer:\n>                     text: \"Generated by 文心\"\n> \n>     # 页面类型定义\n>     pages:\n>         index:\n>             title: \"API 索引\"\n>             template: \"index.hbs\"\n>             data:\n>                 - type: \"classes\"\n>                   query: \"kind:class\"\n>                   sort: \"name\"\n>                 - type: \"functions\"\n>                   query: \"kind:function\"\n>                   sort: \"name\"\n> \n>         class:\n>             title: \"类: {{name}}\"\n>             template: \"class.hbs\"\n>             data:\n>                 - type: \"class\"\n>                   query: \"longname:{{name}}\"\n>                 - type: \"methods\"\n>                   query: \"memberof:{{name}}\"\n>                   groupBy: \"category\"\n>                 - type: \"properties\"\n>                   query: \"memberof:{{name}} kind:member\"\n> \n>         method:\n>             title: \"{{name}}\"\n>             template: \"method.hbs\"\n>             data:\n>                 - type: \"method\"\n>                   query: \"longname:{{name}}\"\n>                 - type: \"params\"\n>                   from: \"method.params\"\n>                 - type: \"returns\"\n>                   from: \"method.returns\"\n> \n>     # 组件定义（可复用）\n>     components:\n>         params:\n>             template: \"components/params.hbs\"\n>             iterate: \"params\"\n>             fields:\n>                 - name: \"name\"\n>                 - type: \"type\"\n>                 - description: \"description\"\n> \n>         returns:\n>             template: \"components/returns.hbs\"\n>             fields:\n>                 - type: \"type\"\n>                 - description: \"description\"\n> \n>         signature:\n>             template: \"components/signature.hbs\"\n>             format: \"{{name}}({{params}}): {{returns}}\"\n> \n>     # 样式配置\n>     styles:\n>         theme: \"default\"\n>         colors:\n>             primary: \"#1890ff\"\n>             secondary: \"#52c41a\"\n>         typography:\n>             fontFamily: \"Inter, sans-serif\"\n>             fontSize: \"14px\"\n> \n>     # 输出配置\n>     output:\n>         format: \"html\"\n>         minify: true\n>         sourceMaps: false\n> ```\n> \n> **实现方案**：\n> \n> 1. **模板编译器**：将 YAML/JSON DSL 编译为 JSDoc 兼容的模板\n>     - 解析 DSL 配置\n>     - 生成 `publish.js` 和 `.tmpl` 文件\n>     - 支持 Handlebars 或其他现代模板引擎\n> \n> 2. **运行时支持**：\n>     - 在文档生成时，自动检测 DSL 配置文件\n>     - 如果存在 `wenxin-template.yaml`，使用 DSL 模板\n>     - 否则，回退到传统的 `publish.js` 模板\n> \n> 3. **模板引擎选择**：\n>     - **Handlebars**：推荐，语法清晰，支持 partials 和 helpers\n>     - **EJS**：备选，更接近 JavaScript\n>     - **Nunjucks**：备选，功能强大\n> \n> **示例：Handlebars 模板**\n> \n> ```handlebars\n> {{! templates/index.hbs }}\n> \u003cdiv class=\"api-index\">\n>   \u003ch1>{{title}}\u003c/h1>\n> \n>   {{#each classes}}\n>     \u003csection class=\"class-section\">\n>       \u003ch2>\u003ca href=\"{{url}}\">{{name}}\u003c/a>\u003c/h2>\n>       \u003cp>{{description}}\u003c/p>\n>     \u003c/section>\n>   {{/each}}\n> \n>   {{#each functions}}\n>     \u003csection class=\"function-section\">\n>       \u003ch2>\u003ca href=\"{{url}}\">{{name}}\u003c/a>\u003c/h2>\n>       {{> signature this}}\n>       \u003cp>{{description}}\u003c/p>\n>     \u003c/section>\n>   {{/each}}\n> \u003c/div>\n> ```\n> \n> ```handlebars\n> {{! templates/components/signature.hbs }}\n> \u003cdiv class=\"signature\">\n>     \u003ccode>\n>         {{name}}(\n>         {{#each params}}\n>             {{name}}:\n>             {{type}}{{#unless @last}}, {{/unless}}\n>         {{/each}}\n>         ):\n>         {{returns.type}}\n>     \u003c/code>\n> \u003c/div>\n> ```\n> \n> **迁移路径**：\n> \n> 1. **阶段 1**：实现 DSL 解析器和编译器\n> 2. **阶段 2**：提供默认 DSL 模板配置\n> 3. **阶段 3**：支持 DSL 和传统模板共存\n> 4. **阶段 4**：逐步迁移到 DSL 优先\n> \n> ### 7. 向后兼容\n> \n> - 保留原有的 `jsdoc-template/` 目录和模板（传统模式）\n> - 支持新的 DSL 模板系统（推荐模式）\n> - 保留原有的 `jsdoc-aliases.js` 插件\n> - 支持 `@aliases` 和 `@category` 标签\n> \n> ## 实施计划\n> \n> ### 阶段 1: 基础架构 ✅\n> \n> - [x] 创建包结构和基础文件\n> - [x] 定义 TypeScript 类型接口\n> - [x] 实现配置管理系统\n> - [x] 实现 JSDoc 处理器\n> - [x] 实现 TypeScript 处理器\n> \n> ### 阶段 2: 核心功能 ✅\n> \n> - [x] 实现类型合并器\n> - [x] 实现主 API 接口\n> - [x] 创建 CLI 工具\n> - [x] 集成 ora 和 chalk 改进用户体验\n> \n> ### 阶段 3: 配置和验证 ✅\n> \n> - [x] 创建 JSON Schema\n> - [x] 实现配置验证\n> - [x] 实现 init 命令\n> - [x] 支持多种配置文件格式\n> \n> ### 阶段 4: 文档和优化\n> \n> - [x] 编写 README 文档\n> - [x] 编写架构文档（ARCHITECTURE.md）\n> - [x] 编写模板系统说明（HOW_IT_WORKS.md）\n> - [ ] 编写使用示例\n> - [ ] 性能优化\n> - [ ] 错误处理改进\n> \n> ### 阶段 5: DSL 模板系统（计划中）\n> \n> - [ ] 设计 DSL 语法规范\n> - [ ] 实现 DSL 解析器\n> - [ ] 实现模板编译器（DSL → JSDoc 模板）\n> - [ ] 集成 Handlebars 模板引擎\n> - [ ] 提供默认 DSL 模板配置\n> - [ ] 实现模板迁移工具\n> - [ ] 编写 DSL 文档和示例\n> \n> ## 技术决策\n> \n> ### 1. 为什么同时使用 JSDoc 和 TypeDoc？\n> \n> **JSDoc 的优势**：\n> \n> - 成熟的注释系统，广泛使用\n> - 灵活的模板系统，可深度定制\n> - 支持 JavaScript 和 TypeScript\n> - 丰富的插件生态\n> \n> **TypeDoc 的优势**：\n> \n> - 深度集成 TypeScript 类型系统\n> - 自动提取类型信息，无需手动注释\n> - 现代化的主题系统\n> - 官方维护，与 TypeScript 同步更新\n> \n> **混合模式的价值**：\n> \n> - **最佳实践**：JSDoc 提供详细注释，TypeDoc 提供类型信息\n> - **完整性**：结合两者优势，生成最完整的文档\n> - **灵活性**：用户可以选择最适合的模式\n> \n> ### 2. 为什么设计 DSL 模板系统？\n> \n> **问题分析**：\n> \n> - `publish.js` 设计复杂，需要理解 JSDoc 内部机制\n> - Underscore Template 语法不够直观\n> - 模板逻辑与数据混合，难以维护和测试\n> \n> **DSL 方案的优势**：\n> \n> - **声明式**：使用 YAML/JSON 定义结构，而非命令式代码\n> - **可维护性**：逻辑与数据分离，易于理解和修改\n> - **类型安全**：提供 TypeScript 类型定义\n> - **现代化**：支持 Handlebars 等现代模板引擎\n> - **向后兼容**：保留对传统模板的支持\n> \n> **技术选择**：\n> \n> - **Handlebars**：语法清晰，支持 partials 和 helpers，社区活跃\n> - **YAML/JSON**：人类可读，易于版本控制，支持注释（YAML）\n> \n> ### 3. 为什么使用 JSON Schema？\n> \n> - 提供配置验证，减少配置错误\n> - IDE 自动补全和类型检查\n> - 清晰的配置文档\n> - 标准化的验证机制\n> \n> ### 4. 为什么保留原有模板？\n> \n> - **向后兼容**：现有项目可以继续使用\n> - **迁移平滑**：用户可以逐步迁移到 DSL\n> - **灵活性**：支持传统和现代两种方式\n> \n> ## 已知限制\n> \n> 1. **JS/TS 配置文件**：当前版本仅支持 JSON 格式的配置文件，JS/TS 格式需要运行时支持（未来改进）\n> \n> 2. **类型合并**：类型合并功能是简化实现，完整实现需要更复杂的集成\n> \n> 3. **性能**：对于大型项目，文档生成可能需要较长时间\n> \n> ## 未来改进\n> \n> ### 短期（v1.1）\n> \n> 1. **DSL 模板系统**：实现基于 YAML/JSON 的模板 DSL\n>     - DSL 解析器和编译器\n>     - Handlebars 模板引擎集成\n>     - 默认 DSL 模板配置\n>     - 模板迁移工具\n> \n> 2. **增强类型合并**：更智能的类型信息合并算法\n>     - 类型推断和补全\n>     - 参数类型自动匹配\n>     - 返回类型增强\n> \n> 3. **支持 JS/TS 配置文件**：实现运行时加载 JS/TS 配置文件\n> \n> ### 中期（v1.2-v1.3）\n> \n> 4. **插件系统**：支持自定义插件扩展功能\n>     - 插件 API 设计\n>     - 插件注册和加载机制\n>     - 官方插件库\n> \n> 5. **主题定制**：基于 DSL 的主题系统\n>     - 主题配置 DSL\n>     - 主题预览和切换\n>     - 主题市场\n> \n> 6. **增量生成**：只生成变更部分的文档\n>     - 文件变更检测\n>     - 增量编译\n>     - 缓存机制\n> \n> ### 长期（v2.0+）\n> \n> 7. **多语言支持**：支持生成多语言文档\n>     - i18n 配置\n>     - 多语言模板\n>     - 翻译工具集成\n> \n> 8. **实时预览**：开发时实时预览文档\n>     - 文件监听\n>     - 热重载\n>     - 开发服务器\n> \n> 9. **文档分析**：文档质量分析和建议\n>     - 覆盖率统计\n>     - 缺失注释检测\n>     - 文档完整性评分\n> \n> ## 迁移指南\n> \n> ### 从原有工具迁移\n> \n> 1. **安装新工具**\n> \n>     ```bash\n>     pnpm add -D @systembug/wenxin\n>     ```\n> \n> 2. **生成配置文件**\n> \n>     ```bash\n>     npx wenxin init\n>     ```\n> \n> 3. **更新脚本**\n> \n>     ```json\n>     {\n>         \"scripts\": {\n>             \"docs\": \"wenxin\"\n>         }\n>     }\n>     ```\n> \n> 4. **测试**\n>     ```bash\n>     npx wenxin\n>     ```\n> \n> ### 配置文件迁移\n> \n> 原有的 `jsdoc-conf.json` 可以继续使用，或迁移到新的 `wenxin.config.json`：\n> \n> ```json\n> {\n>     \"$schema\": \"./node_modules/@systembug/wenxin/schemas/config.schema.json\",\n>     \"mode\": \"jsdoc\",\n>     \"jsdoc\": {\n>         \"enabled\": true,\n>         \"source\": {\n>             \"include\": [\"src/**/*.ts\"],\n>             \"exclude\": [\"node_modules\", \"dist\"]\n>         },\n>         \"opts\": {\n>             \"destination\": \"doc\",\n>             \"template\": \"./node_modules/@systembug/wenxin/jsdoc-template\"\n>         }\n>     }\n> }\n> ```\n> \n> ## 参考\n> \n> - [JSDoc 官方文档](https://jsdoc.app/)\n> - [TypeDoc 官方文档](https://typedoc.org/)\n> - [JSON Schema 规范](https://json-schema.org/)\n> - [RFC 0001: 青鸟通用发布工具](../0001-universal-publish-tool.md)\n> \n> ## 变更日志\n> \n> ### 2025-01-XX - RFC 更新：DSL 模板系统设计\n> \n> - 📝 明确 JSDoc 模板系统使用方式\n> - 📝 明确 TypeDoc 集成和使用方式\n> - 📝 明确混合模式文档生成流程\n> - 🎨 设计基于 DSL 的模板系统方案\n> - 📋 定义 DSL 语法规范和实现计划\n> - 🔄 更新未来改进路线图\n> \n> ### 2025-01-XX - 初始实现\n> \n> - ✅ 完成基础架构和核心功能\n> - ✅ 实现配置系统和验证\n> - ✅ 实现 CLI 工具和 init 命令\n> - ✅ 创建 JSON Schema\n> - ✅ 集成 ora 和 chalk 改进用户体验\n> - ✅ 重命名包为 @systembug/wenxin\n> - ✅ 支持 pnpm/npm/yarn 包管理器"},"directory-source-6":{"body":"# .spec/rfc/completed/0003-tongyu-cli-locale-package.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0003: 通语(Tong Yu) CLI Locale 包设计规范\n> \n> **Status:** Implemented\n> \n> - **开始日期**: 2026-07-11\n> - **更新日期**: 2026-07-11\n> - **RFC PR**:\n> - **实现议题**:\n> - **作者**: AI Assistant\n> - **状态**: Implemented\n> - **命名空间**: `@systembug/tongyu`\n> - **依赖**: 无\n> \n> **变更历史**:\n> \n> - 2026-07-11: 初稿 — locale-only 共享层、各工具自持文案、Vite 构建\n> \n> ## 摘要\n> \n> 本 RFC 定义 **通语(Tong Yu)** — `@systembug/cli` 生态共享的 **OS locale 解析** 包。通语只负责「读系统语言偏好」，**不包含** 各 CLI 的用户文案 catalog 与 `t()` 翻译逻辑。首个消费者为 **盘古(pangu)**；后续 **青鸟(qingniao)** 等工具复用同一 locale 层。\n> \n> ## 黄金法则 (Golden Rules)\n> \n> - **100% 测试覆盖率是强制要求**：`@systembug/tongyu` 源码须达到 lines / functions / branches / statements 均为 100%。\n> - **库构建必须使用 Vite**：与 `@systembug/diting`、`@systembug/qingniao` 一致，双格式输出（ESM + CJS），禁止用 `tsc` 作为库 build 入口。\n> - **翻译归各包**：catalog、`formatMessage`、`createTranslator` 留在 `pangu`、`qingniao` 等消费者内部，通语不导出。\n> \n> ## 动机\n> \n> ### 问题\n> \n> 1. **Ctrl+C 退出体验差**：pangu 经 `pnpm --filter` 启动时 SIGINT 触发 `ERR_PNPM_RECURSIVE_RUN_FIRST_FAIL`。\n> 2. **语言硬编码**：CLI 文案固定中文或英文，未尊重 OS / shell locale。\n> 3. **重复实现风险**：多个 `@systembug/*` CLI 各自解析 `LANG` / `LC_*`，行为不一致。\n> \n> ### 目标\n> \n> 1. 统一、可测试的 OS locale 检测（基于 [os-locale](https://github.com/sindresorhus/os-locale)）。\n> 2. 各工具保留独立文案与翻译函数，仅依赖通语解析 `zh` | `en`。\n> 3. 共享包构建与 monorepo 黄金法则对齐（Vite lib mode）。\n> \n> ## 范围\n> \n> ### In-Scope\n> \n> - 新建 `@systembug/tongyu` 包\n> - `resolveLocale()`、`getOsLocaleTag()`、`localeTagToSupported()` 等纯函数 API\n> - `SYSTEMBUG_LOCALE` 全局覆盖 + 工具可选 `overrideEnvKeys`（如 `PANGU_LANG`）\n> - pangu 集成：包内 `messages.ts` + 本地 translator；CLI 全量使用 `t()`\n> - pangu 子进程优雅退出（包目录内 `pnpm dev`、SIGINT 130/143 视为成功）\n> \n> ### Out-of-Scope\n> \n> - 共享文案 catalog\n> - 共享 `createTranslator` / `formatMessage` 导出\n> - 超过 `zh` / `en` 的语言扩展（可后续 RFC）\n> - i18next / ICU 等重量级方案\n> - 全 monorepo Vite 8 升级（单独变更，本 RFC 仅要求 tongyu 与现有 @systembug 库 Vite 模式一致）\n> \n> ## 通语哲学\n> \n> **通语** — 共通之语：让各 CLI **听懂 OS 在说什么**，而非替它们 **说什么**。\n> \n> | 包                | 职责                                  |\n> | ----------------- | ------------------------------------- |\n> | **通语 tongyu**   | OS / env → `SupportedLocale`          |\n> | **盘古 pangu**    | pangu 专属 catalog + `t()`            |\n> | **青鸟 qingniao** | qingniao 专属 catalog + `t()`（后续） |\n> \n> ## 技术设计\n> \n> ### 1. Locale 优先级\n> \n> ```\n> SYSTEMBUG_LOCALE\n>   → 工具 overrideEnvKeys（如 PANGU_LANG）\n>   → os-locale()  // LC_ALL, LC_MESSAGES, LANG, LANGUAGE + OS 系统语言\n>   → 映射为 zh | en\n> ```\n> \n> ### 2. `@systembug/tongyu` 公开 API\n> \n> ```typescript\n> // 常量\n> LOCALE_OVERRIDE_ENV = \"SYSTEMBUG_LOCALE\"\n> SupportedLocale = \"zh\" | \"en\"\n> \n> // 标签工具\n> normalizeLocaleTag(locale: string): string\n> isChineseLocale(locale: string): boolean\n> localeTagToSupported(locale: string): SupportedLocale\n> \n> // 解析\n> readLocaleOverride(env, overrideEnvKeys?): string | undefined\n> resolveLocale(options?: ResolveLocaleOptions): SupportedLocale\n> getOsLocaleTag(options?): string\n> ```\n> \n> **不导出**：`formatMessage`、`createTranslator`、`MessageCatalog`。\n> \n> ### 3. 消费者模式（以 pangu 为例）\n> \n> ```\n> packages/@systembug/pangu/src/\n> ├── i18n/\n> │   └── translator.ts    # 本地 formatMessage + createTranslator(resolveLocale from tongyu)\n> ├── messages.ts          # PANGU_CATALOG + export t()\n> ├── cli.ts               # 全部用户可见字符串走 t()\n> └── process-utils.ts     # 优雅退出 + resolvePackageDirectory\n> ```\n> \n> ```typescript\n> import { resolveLocale, type SupportedLocale } from \"@systembug/tongyu\";\n> \n> // pangu/src/i18n/translator.ts — 仅 pangu 内部使用\n> export function createTranslator\u003cTKey extends string>(\n>     catalog: Record\u003cSupportedLocale, Record\u003cTKey, string>>,\n>     options?: { overrideEnvKeys?: string[]; locale?: SupportedLocale },\n> ): (key: TKey, params?: Record\u003cstring, string | number>) => string;\n> ```\n> \n> ### 4. 包结构与构建\n> \n> 对齐 `@systembug/diting`：\n> \n> ```\n> packages/@systembug/tongyu/\n> ├── package.json          # exports: .mjs + .cjs + .d.ts\n> ├── vite.config.ts\n> ├── tsconfig.json\n> ├── src/\n> │   ├── index.ts\n> │   ├── constants.ts\n> │   ├── locale-tag.ts\n> │   └── resolve-locale.ts\n> └── tests/\n>     └── *.test.ts\n> ```\n> \n> ```json\n> {\n>     \"exports\": {\n>         \".\": {\n>             \"import\": { \"types\": \"./dist/index.d.ts\", \"default\": \"./dist/index.mjs\" },\n>             \"require\": { \"types\": \"./dist/index.d.ts\", \"default\": \"./dist/index.cjs\" }\n>         }\n>     }\n> }\n> ```\n> \n> 依赖：`os-locale@^8`（Node >= 20）。\n> \n> ### 5. pangu 行为变更摘要\n> \n> | 项     | 变更                                            |\n> | ------ | ----------------------------------------------- |\n> | 启动   | `pnpm --filter` → 解析包目录后在包内 `pnpm dev` |\n> | Ctrl+C | `attachGracefulShutdown`；130/143 → exit 0      |\n> | 文案   | OS locale 驱动；`messages.ts` 自持 catalog      |\n> | 依赖   | `@systembug/tongyu: workspace:*`                |\n> \n> ## 成功标准\n> \n> 1. `@systembug/tongyu` 使用 **Vite** 构建，产出 ESM/CJS/d.ts。\n> 2. tongyu 测试 100% 覆盖且全通过；无 `create-translator` / `format-message` 公开导出。\n> 3. pangu 测试全通过；Ctrl+C 无 `ERR_PNPM_RECURSIVE_RUN_FIRST_FAIL`。\n> 4. `SYSTEMBUG_LOCALE=zh-CN` / `en-US` 可覆盖 OS 设置。\n> 5. qingniao 可在不修改 tongyu 的情况下按同一模式接入（文档说明即可，实现可后续 PR）。\n> \n> ## 风险\n> \n> | 风险                    | 缓解                                             |\n> | ----------------------- | ------------------------------------------------ |\n> | os-locale 在 CI 无 LANG | 测试 mock；支持 `SYSTEMBUG_LOCALE`               |\n> | 仅 zh/en 不够           | 后续 RFC 扩展 `SupportedLocale`                  |\n> | pangu 仍用 tsc 构建     | 本 RFC 不强制改 pangu build；仅 tongyu 必须 Vite |\n> \n> ## 实施计划\n> \n> ### 阶段一：通语包修正（当前 Draft 代码对齐 RFC）\n> \n> - **步骤 1.1**: 删除 `src/create-translator.ts`、`src/format-message.ts` 及对应测试。\n> - **步骤 1.2**: 添加 `vite.config.ts`、`vite-plugin-dts`；`build` 脚本改为 `vite build`；exports 双格式。\n> - **步骤 1.3**: 更新 `README.md` — locale-only 说明。\n> - **步骤 1.4**: `pnpm test:coverage` — 100% 通过。\n> \n> ### 阶段二：pangu 翻译下沉\n> \n> - **步骤 2.1**: 新增 `pangu/src/i18n/translator.ts`（本地 translator，依赖 tongyu `resolveLocale`）。\n> - **步骤 2.2**: 重构 `messages.ts` — 不再从 tongyu 导入 `createTranslator`。\n> - **步骤 2.3**: 确认 `cli.ts` / `process-utils.ts` 已用 `t()`。\n> - **步骤 2.4**: 更新 `process-utils.test.ts`；pangu 测试全通过。\n> \n> ### 阶段三：文档与索引\n> \n> - **步骤 3.1**: 本 RFC 状态 → Accepted（评审后）→ Implemented（落地后）。\n> - **步骤 3.2**: 更新 `.spec/rfc/index.md`。\n> \n> ## 测试策略\n> \n> - **tongyu**: mock `os-locale`；覆盖 override、`zh-CN`/`en-US` 映射、Intl 回退路径。\n> - **pangu**: 现有 config/process-utils 测试；shutdown 中文案用 `getShutdownMessage(\"zh\")` 固定 locale。\n> \n> ## 替代方案\n> \n> | 方案                  | 弃用原因                          |\n> | --------------------- | --------------------------------- |\n> | 各 CLI 手写 LANG 解析 | 重复、macOS 上不准                |\n> | tongyu 共享 catalog   | 工具文案差异大，违反单一职责      |\n> | i18next               | CLI 字符串少，过重                |\n> | tongyu 用 tsc build   | 违反 monorepo Vite 库构建黄金法则 |"},"directory-source-7":{"body":"# .spec/rfc/completed/0006-qingniao-agent-cli-protocol.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0006: Qingniao Agent CLI Protocol\n> \n> **Status:** Implemented\n> **作者**: Codex  \n> **创建日期**: 2026-08-16  \n> **最后更新**: 2026-09-27  \n> **依赖**: 无；扩展现有 Qingniao CLI 公开行为\n> \n> **变更历史**:\n> \n> - 2026-08-16: 创建 Agent 可解析 CLI 协议草案。\n> - 2026-08-16: 批准并实现 JSONL CLI、只读 plan、JSON doctor 与显式授权门禁。\n> - 2026-09-27: 协议随 `d5c7daf` 合入后关闭。全包历史覆盖率基线仍低于 100%，关闭不把该基线改写成已达标。\n> \n> ## Summary\n> \n> 让 Agent 能发现 Qingniao 能力、检查发布条件、预览发布计划，并以稳定、可解析、非交互方式执行发布或接收准确失败信息。\n> \n> ## 黄金法则 (Golden Rules)\n> \n> - 所有新增代码必须达到 100% lines、functions、branches、statements 覆盖率。\n> - `--json` 不得破坏现有交互式人类 CLI。\n> - stdout 是机器协议；诊断和子进程原始输出只能写入 stderr。\n> - 发布是有副作用操作；Agent 必须显式传入 `--yes`，协议不得隐式确认。\n> \n> ## Goal\n> \n> 让 Agent 能发现 Qingniao 能力、检查发布条件、预览发布计划，并以稳定、可解析、非交互方式执行发布或接收准确失败信息。\n> \n> ## Problem\n> \n> 当前 CLI 以 inquirer、ora spinner 和自然语言输出为中心。Agent 无法可靠地区分进度、警告、错误和最终结果；`--silent`、`--verbose` 已声明但未形成机器接口。失败诊断虽已改进，仍不是可承诺的结构化协议。\n> \n> ## Scope\n> \n> ### In-Scope\n> \n> - 根发布命令、`doctor` 和新增只读 `plan` 命令支持 `--json`。\n> - 定义版本化 JSON Lines（JSONL）事件协议。\n> - 定义成功、失败、跳过、检查结果、发布计划的数据结构与稳定退出码。\n> - `--json` 模式强制无交互；缺少 `--yes` 时返回结构化确认需求，不修改工作区。\n> - 更新 `--help`、README 和 Qingniao 文档，提供 Agent 调用范例。\n> - 为 human 与 JSON reporter 建立独立边界，禁止业务阶段直接调用 `ora` 或 `console`。\n> \n> ### Out-of-Scope\n> \n> - 自动执行发布而不经过 `--yes`。\n> - 绕过 Git hooks、认证、构建、测试或发布前检查。\n> - 远程 Agent 服务、HTTP API、后台守护进程。\n> - 修改项目发布策略、NPM OTP 或 Git 凭据模型。\n> \n> ## Proposal\n> \n> ### Commands\n> \n> ```text\n> qingniao --help\n> qingniao doctor --json\n> qingniao plan --json\n> qingniao --json --yes\n> qingniao --json --yes --dry-run\n> ```\n> \n> `--help` 保留 Commander 标准帮助。`doctor --json` 只检查。`plan --json` 只发现 packages、配置、版本策略和将运行的阶段，不写文件、不提交、不发布。根命令的 `--json --yes` 才允许执行已有发布流程。\n> \n> ### JSONL contract\n> \n> stdout 每行是一个完整 JSON 对象，禁止 spinner、颜色、自然语言或子进程输出。所有事件包含：\n> \n> ```json\n> {\n>     \"schemaVersion\": 1,\n>     \"event\": \"stage\",\n>     \"stage\": \"verify\",\n>     \"status\": \"started\",\n>     \"timestamp\": \"2026-08-16T17:00:00.000Z\"\n> }\n> ```\n> \n> 事件种类：\n> \n> | event    | Required fields                               | Meaning                                     |\n> | -------- | --------------------------------------------- | ------------------------------------------- |\n> | `stage`  | `stage`, `status`                             | `started`, `succeeded`, `failed`, `skipped` |\n> | `check`  | `check`, `status`                             | doctor 或验证结果                           |\n> | `plan`   | `packages`, `actions`, `requiresConfirmation` | 无副作用计划                                |\n> | `result` | `status`, `exitCode`, `summary`               | 唯一终结事件                                |\n> | `error`  | `code`, `message`, `command?`, `output?`      | 可诊断失败                                  |\n> \n> `result` 必须是 stdout 最后一行。错误退出前必须写 `error` 和失败 `result`。`schemaVersion` 只在不兼容变更时递增。\n> \n> ### Error boundary\n> \n> 所有阶段通过 reporter 发出结构化事件；`exec` 继续保留原始 command output。JSON 模式下，机器字段写 stdout `error` 事件，完整原始子进程输出写 stderr。Human 模式保留当前 locale 行为和单次错误输出。\n> \n> 错误码：`0` 成功、`1` 执行或检查失败、`2` 用法或配置错误、`3` 需要显式确认、`4` 认证失败。Agent 先读 `error.code`，再读 `message` 和 `command`；不得依赖英文文本解析。\n> \n> ### Backward compatibility\n> \n> 不带 `--json` 的命令保持当前 prompts、spinner、locale 和退出语义。`--json` 与 `--silent` 不允许同时出现；组合时以用法错误退出。`--json` 自动禁用颜色和 prompt，但不等于 `--yes`。\n> \n> ## Data Flow\n> \n> ```mermaid\n> %%{init: {'theme': 'base', 'themeVariables': {'primaryColor': '#2563eb', 'primaryTextColor': '#ffffff', 'primaryBorderColor': '#1d4ed8', 'lineColor': '#64748b', 'secondaryColor': '#e2e8f0', 'tertiaryColor': '#f8fafc'}}}%%\n> flowchart LR\n>     A[Agent] --> B[Qingniao CLI]\n>     B --> C{Reporter}\n>     C -->|JSONL stdout| D[Machine events]\n>     C -->|Human TTY| E[Prompt and spinner]\n>     B --> F[Release stages]\n>     F --> C\n>     F -->|raw child output| G[stderr]\n> ```\n> \n> ## Core Deliverables\n> \n> - `AgentReporter`、`HumanReporter` 与版本化 JSONL 类型。\n> - `--json` 选项和 `plan` 子命令。\n> - `doctor --json` 结构化输出。\n> - Agent CLI 文档、help 文案和使用范例。\n> - 成功、失败、确认需求、计划只读性、stdout 纯 JSONL 的回归测试。\n> \n> ## Success Criteria\n> \n> - `qingniao --json --yes --dry-run` 的 stdout 可逐行 `JSON.parse`，且最后一行是 `result`。\n> - `qingniao plan --json` 运行前后 `git diff --exit-code` 为 0。\n> - `qingniao --json` 无 `--yes` 时退出码为 3，且不写版本、不提交、不发布。\n> - 所有 JSON 模式错误带非空 `code`、`message`，命令错误另带 `command`。\n> - Human CLI 现有测试全部保持通过。\n> - 新增模块与分支达到 100% 覆盖率；lint、typecheck、test、format 全部通过。\n> \n> ## Implementation Plan\n> \n> ### Phase 1: Protocol boundary\n> \n> 1. **Step 1.1**: 在 `packages/@systembug/qingniao/src/reporters/types.ts` 定义 `JsonEvent`、终结事件和错误码联合类型。  \n>    **Expected output**: 版本化、无 `any` 的 JSONL schema。  \n>    **Tests**: 覆盖所有 event 与 error code 分支。\n> 2. **Step 1.2**: 在 `src/reporters/` 实现 `HumanReporter` 与 `JsonReporter`。  \n>    **Expected output**: JSON reporter 只写 stdout JSONL；human reporter 保持 ora 输出。  \n>    **Tests**: stdout/stderr 分离、每行可解析、终结事件唯一且最后。\n> 3. **Step 1.3**: 改造 `src/core/executor.ts` 与 stages，使其依赖 reporter，不直接输出 UI。  \n>    **Expected output**: 执行阶段的 started/succeeded/failed/skipped 事件。  \n>    **Tests**: 每个阶段成功、跳过和失败事件顺序。\n> \n> ### Phase 2: Agent commands and safety\n> \n> 1. **Step 2.1**: 在 `src/cli.ts` 增加 `--json`，并在 JSON 模式禁用颜色和 prompt。  \n>    **Expected output**: 无 `--yes` 的副作用命令返回 exit code 3 与 `confirmation_required` error。  \n>    **Tests**: CLI 集成测试验证退出码、无 prompt、无工作区写入。\n> 2. **Step 2.2**: 在 `src/commands/plan.ts` 实现只读计划生成。  \n>    **Expected output**: `plan --json` 返回 packages、版本策略、actions 和确认需求。  \n>    **Tests**: fixture workspace；命令运行前后文件哈希相同。\n> 3. **Step 2.3**: 扩展 `src/commands/doctor.ts` 输出 JSON 检查事件。  \n>    **Expected output**: 与 human doctor 相同检查语义。  \n>    **Tests**: 正常、warning、strict failure 和配置缺失。\n> \n> ### Phase 3: Documentation and compatibility\n> \n> 1. **Step 3.1**: 更新 `packages/@systembug/qingniao/README.md` 与 `docs/tools/qingniao.md`。  \n>    **Expected output**: Agent safe release sequence 与 JSONL schema reference。  \n>    **Tests**: 文档命令在 fixture workspace 运行。\n> 2. **Step 3.2**: 运行全包测试、coverage、lint、typecheck、format。  \n>    **Expected output**: 所有质量门禁 exit code 0。  \n>    **Tests**: `pnpm --filter @systembug/qingniao test:coverage`、lint、typecheck、format check。\n> \n> ## Risks\n> \n> - 直接在既有 stages 中散布 JSON `console.log` 会再次制造重复输出。必须只通过 reporter。\n> - stdout 中任意子进程文本都会破坏 JSONL。JSON 模式必须重定向子进程输出到 stderr。\n> - `--json` 被误当作批准发布会破坏用户空间。批准只能来自显式 `--yes`。\n> - 终结事件缺失会使 Agent 无法判断结果。CLI 顶层必须负责唯一终结事件。\n> \n> ## Alternatives\n> \n> 1. **只增加 `--json` 最终摘要**：改动小，但 Agent 无进度、无法定位阶段失败。拒绝。\n> 2. **输出单个 JSON 文档**：结构简单，但不能流式报告长构建。拒绝。\n> 3. **JSONL reporter + 只读 plan**：稳定、可流式解析、发布前可审查。推荐。\n> \n> ## Acceptance Gate\n> \n> 实现的 Agent 入口：`plan --json`、`doctor --json`、`--json --yes`，已随 `d5c7daf` 合入。2026-09-27 关闭本 RFC。全包历史覆盖率基线为 21.11%，关闭时没有把全包覆盖率重测到 100%。"},"directory-source-8":{"body":"# .spec/rfc/0007-qingniao-publish-gaps.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0007: Qingniao publish gaps (Umbrella)\n> \n> **Status:** Draft\n> \n> **Type:** Umbrella\n> \n> ## Summary\n> \n> 本伞只索引青鸟发布流程里尚未接线的事项。每件事一篇子 RFC。实现细节写在子 RFC，不写在这里。\n> \n> ## Problem\n> \n> 这些事项彼此独立。放进 RFC 0001 会让一篇 RFC 同时承诺钩子、插件、校验、发现、发布参数、版本、构建和界面。\n> \n> ## Goals\n> \n> 列出的子 RFC 全部 Implemented 之后，本伞才可以关闭。\n> \n> ## Non-goals\n> \n> 不改已经落地的发布主路径。不包含 RFC 0006 的 Agent JSON 协议。关闭后新缺口另开伞，不往本伞追加子 RFC。\n> \n> ## Children\n> \n> | RFC                                                | Concern                                            |\n> | -------------------------------------------------- | -------------------------------------------------- |\n> | [0022](completed/0022-run-registry-login.md)       | Run registry login when publish is unauthenticated |\n> | [0021](0021-qingniao-config-web-ui.md)             | Web UI for qingniao publish config                 |\n> | [0020](0020-qingniao-ci-templates.md)              | Ship CI templates that run qingniao                |\n> | [0019](0019-package-manager-path-fallback.md)      | Detect the package manager from PATH               |\n> | [0018](0018-turbo-json-tasks.md)                   | Run Turbo using tasks declared in turbo.json       |\n> | [0017](0017-dependency-publish-order.md)           | Publish packages in dependency order               |\n> | [0016](0016-replace-workspace-protocols.md)        | Replace workspace protocols before publish         |\n> | [0015](0015-sync-workspace-dependency-versions.md) | Sync workspace dependency versions on bump         |\n> | [0014](0014-publish-otp-prompt.md)                 | Prompt for OTP when otpRequired is set             |\n> | [0013](0013-publish-access-flag.md)                | Honor publish.access for scoped packages           |\n> | [0012](0012-publish-registry-flag.md)              | Pass publish.registry to the publish command       |\n> | [0011](0011-yarn-npm-package-discovery.md)         | Discover yarn and npm workspace packages           |\n> | [0010](0010-qingniao-config-validation.md)         | Validate qingniao config against a schema          |\n> | [0009](0009-qingniao-plugin-loader.md)             | Load third-party qingniao plugins                  |\n> | [0008](0008-wire-publish-hooks.md)                 | Wire publish hooks into the executor               |\n> \n> ## Acceptance\n> \n> 子 RFC 都已 Implemented 并归档后，将本伞 advance 为 Implemented 再 archive。之后的新事项使用新的伞。"},"directory-source-9":{"body":"# .spec/rfc/0008-wire-publish-hooks.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0008: Wire publish hooks into the executor (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> 发布执行器在版本、构建、发布前后调用 `PublishConfig.hooks`。\n> \n> ## Problem\n> \n> `core/hooks.ts` 的 `executeHook` 没有调用方，配置里的钩子不会运行。\n> \n> ## Goals\n> \n> 已配置的 before/after 钩子按阶段被调用。未配置时行为与现在相同。\n> \n> ## Non-goals\n> \n> 不加载第三方插件。插件入口属于 RFC 0009。\n> \n> ## Design\n> \n> 在 `core/executor.ts` 的版本、构建、发布阶段前后调用 `executeHook`。\n> \n> ## Acceptance\n> \n> 测试断言钩子顺序为 before 然后阶段然后 after。未配置钩子的发布路径保持原样。"},"directory-source-10":{"body":"# .spec/rfc/0009-qingniao-plugin-loader.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0009: Load third-party qingniao plugins (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> 发布开始前按配置加载第三方插件。\n> \n> ## Problem\n> \n> 青鸟没有插件加载模块，扩展点只能改核心代码。\n> \n> ## Goals\n> \n> 配置中的插件入口被加载。模块缺失或插件抛错时中止发布。\n> \n> ## Non-goals\n> \n> 不负责钩子是否被执行器调用。那是 RFC 0008。不做配置界面。那是 RFC 0021。\n> \n> ## Design\n> \n> 新增插件加载模块，在 `executePublish` 开头读取插件列表并加载。\n> \n> ## Acceptance\n> \n> 测试覆盖加载成功、入口缺失、插件初始化抛错。"},"directory-source-11":{"body":"# .spec/rfc/0010-qingniao-config-validation.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0010: Validate qingniao config against a schema (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> 发布前用 schema 校验青鸟配置，非法配置直接失败。\n> \n> ## Problem\n> \n> `config/schema.ts` 是空对象。`validateConfig` 忽略入参并固定返回 valid。\n> \n> ## Goals\n> \n> 类型错误或未知结构返回非空错误列表，且 valid 为 false。合法最小配置通过。\n> \n> ## Non-goals\n> \n> 不实现各个配置字段的运行时效果。那些字段各自有子 RFC。\n> \n> ## Design\n> \n> 填充 `config/schema.ts`，让 `config/validator.ts` 按 schema 校验 `PublishConfig`。\n> \n> ## Acceptance\n> \n> 测试覆盖缺字段、错类型、合法最小配置。"},"directory-source-12":{"body":"# .spec/rfc/0011-yarn-npm-package-discovery.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0011: Discover yarn and npm workspace packages (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> `packageManager` 为 yarn 或 npm 时，用对应的 workspace 命令发现包。\n> \n> ## Problem\n> \n> `core/executor.ts` 在 workspace 模式下始终调用 `discoverPackagesWithPnpm`。\n> \n> ## Goals\n> \n> yarn 使用 `yarn workspaces list`。npm 使用 `npm ls --workspaces`。pnpm 路径不变。\n> \n> ## Non-goals\n> \n> 不在没有 lockfile 时猜测包管理器。那是 RFC 0019。\n> \n> ## Design\n> \n> 在 `utils/package.ts` 增加 yarn 与 npm 的发现函数，执行器按 `packageManager` 选择。\n> \n> ## Acceptance\n> \n> pnpm、yarn、npm 各有发现测试。"},"directory-source-13":{"body":"# .spec/rfc/0012-publish-registry-flag.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0012: Pass publish.registry to the publish command (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> `publish.registry` 有值时，发布命令带上 `--registry`。\n> \n> ## Problem\n> \n> 该字段只出现在 `types.ts`。`stages/publish.ts` 不读它。\n> \n> ## Goals\n> \n> npm、pnpm、yarn 的 publish 命令都带配置的 registry。未配置时不追加该参数。\n> \n> ## Non-goals\n> \n> 不改 `--access`。那是 RFC 0013。不提示 OTP。那是 RFC 0014。不一次发布到多个 registry。\n> \n> ## Design\n> \n> 在 `stages/publish.ts` 拼接 `--registry`。\n> \n> ## Acceptance\n> \n> 测试有 registry 与无 registry 两种命令字符串。"},"directory-source-14":{"body":"# .spec/rfc/0013-publish-access-flag.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0013: Honor publish.access for scoped packages (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> scoped 包的 `--access` 使用 `publish.access`，不再写死 public。\n> \n> ## Problem\n> \n> `stages/publish.ts` 对 scoped 包固定追加 `--access public`。\n> \n> ## Goals\n> \n> `public` 与 `restricted` 按配置传递。未设置时 scoped 包仍默认 public。\n> \n> ## Non-goals\n> \n> 不改 registry。那是 RFC 0012。\n> \n> ## Design\n> \n> 在 `stages/publish.ts` 读取 `config.publish.access`。\n> \n> ## Acceptance\n> \n> 测试 public、restricted、未设置三种命令。"},"directory-source-15":{"body":"# .spec/rfc/0014-publish-otp-prompt.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0014: Prompt for OTP when otpRequired is set (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n>
