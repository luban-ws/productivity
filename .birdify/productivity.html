\n> ## Summary\n> \n> `publish.otpRequired` 为 true 时，发布前向用户要一次性密码并传给发布命令。\n> \n> ## Problem\n> \n> 该字段未被读取。现有逻辑只在子进程输出含 OTP 字样时把错误原样抛出。\n> \n> ## Goals\n> \n> 开启时提示并传递 OTP。关闭时不提示。\n> \n> ## Non-goals\n> \n> 不增加 Web 表单。那是 RFC 0021。\n> \n> ## Design\n> \n> 在 `stages/publish.ts` 配合 `utils/prompts.ts` 读取密码并追加到发布命令。\n> \n> ## Acceptance\n> \n> 测试 otpRequired 为 true 与 false 两种路径。"},"directory-source-16":{"body":"# .spec/rfc/0015-sync-workspace-dependency-versions.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0015: Sync workspace dependency versions on bump (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> `version.syncWorkspaceDeps` 为 true 时，升版本同时改写 workspace 依赖的版本范围。\n> \n> ## Problem\n> \n> `config/loader.ts` 把该字段默认设为 true，但 `stages/version.ts` 不读它。\n> \n> ## Goals\n> \n> 开启时依赖范围更新到新版本。关闭时不改依赖字段。\n> \n> ## Non-goals\n> \n> 不把 `workspace:` 协议改写成具体版本。那是 RFC 0016。\n> \n> ## Design\n> \n> 在 `stages/version.ts` 于版本写回时处理 workspace 依赖。\n> \n> ## Acceptance\n> \n> 开启与关闭各用 package.json 夹具测试。"},"directory-source-17":{"body":"# .spec/rfc/0016-replace-workspace-protocols.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0016: Replace workspace protocols before publish (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> `publish.replaceWorkspaceProtocols` 为 true 时，发布前把 `workspace:` 依赖写成具体版本或范围。\n> \n> ## Problem\n> \n> `stages/publish.ts` 里该分支是空的，注释写着 TODO。\n> \n> ## Goals\n> \n> 按 `protocolReplacement` 写成 version 或 range。未配置 custom 替换器时，custom 模式失败并说明原因。关闭开关时不改文件。\n> \n> ## Non-goals\n> \n> 不在升版本阶段改依赖。那是 RFC 0015。\n> \n> ## Design\n> \n> 在 `stages/publish.ts` 发布每个包之前改写该包的依赖字段。\n> \n> ## Acceptance\n> \n> 测试 `workspace:*`、`workspace:^`，以及开关关闭时文件不变。"},"directory-source-18":{"body":"# .spec/rfc/0017-dependency-publish-order.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0017: Publish packages in dependency order (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> 按 `dependencies.respectDependencyOrder` 决定包的发布顺序。\n> \n> ## Problem\n> \n> 类型里有该字段，执行器仍按发现顺序发布。\n> \n> ## Goals\n> \n> topological 时被依赖的包先发布。parallel 保持发现顺序。custom 调用 `customOrder`。有环时报错。\n> \n> ## Non-goals\n> \n> 不改构建步骤的顺序。\n> \n> ## Design\n> \n> 发布前对 `context.packages` 排序，排序函数放在独立模块，供 `stages/publish.ts` 使用。\n> \n> ## Acceptance\n> \n> 测试 A 依赖 B 时 B 先于 A，以及依赖环报错。"},"directory-source-19":{"body":"# .spec/rfc/0018-turbo-json-tasks.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0018: Run Turbo using tasks declared in turbo.json (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> `useTurbo` 时按 `turbo.json` 声明的任务运行，而不是固定拼出 `turbo build build`。\n> \n> ## Problem\n> \n> `stages/build.ts` 不读 `turbo.json`。默认 `turboTasks` 是 `build`，命令却是 `turbo build` 再拼任务名。\n> \n> ## Goals\n> \n> 未配置 `turboTasks` 时使用 `turbo.json` 的任务名。配置了则只用配置，且不重复追加 build。\n> \n> ## Non-goals\n> \n> 不改 Nx 路径。不从 turbo outputs 推断产物路径。\n> \n> ## Design\n> \n> 在 `stages/build.ts` 读取 `turbo.json` 的 tasks 或 pipeline。\n> \n> ## Acceptance\n> \n> 夹具 `turbo.json` 生成的命令任务名来自文件，且不含重复的 build。"},"directory-source-20":{"body":"# .spec/rfc/0019-package-manager-path-fallback.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0019: Detect the package manager from PATH (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> 没有 `packageManager` 字段、也没有 lockfile 时，从 PATH 上第一个 pnpm、yarn 或 npm 推断包管理器。\n> \n> ## Problem\n> \n> `detectPackageManager` 在这种情况下返回 null。\n> \n> ## Goals\n> \n> 优先级为 pnpm、yarn、npm。三个都不在 PATH 上时仍返回 null。已有 lockfile 或 `packageManager` 字段时规则不变。\n> \n> ## Non-goals\n> \n> 不因此改变包发现命令。包发现属于 RFC 0011。\n> \n> ## Design\n> \n> 改 `utils/auto-detect.ts` 的 `detectPackageManager`。\n> \n> ## Acceptance\n> \n> 测试 PATH 上分别只有 pnpm、yarn、npm，以及三个都没有。"},"directory-source-21":{"body":"# .spec/rfc/0020-qingniao-ci-templates.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0020: Ship CI templates that run qingniao (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> 提供可复制的 GitHub Actions 与 GitLab CI 片段，用来运行 qingniao。\n> \n> ## Problem\n> \n> 仓库里没有这些模板。\n> \n> ## Goals\n> \n> 模板只调用已有 CLI，不内嵌另一套发布逻辑。\n> \n> ## Non-goals\n> \n> 不实现远程 Agent 服务。不改发布阶段代码。Agent 协议属于 RFC 0006。\n> \n> ## Design\n> \n> 模板放在 `packages/@systembug/qingniao` 的 templates 目录，并在 README 指向它们。\n> \n> ## Acceptance\n> \n> 两个模板文件存在，其中的命令与 README 的 qingniao 调用一致。"},"directory-source-22":{"body":"# .spec/rfc/0021-qingniao-config-web-ui.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0021: Web UI for qingniao publish config (child of 0007)\n> \n> **Status:** Draft\n> \n> **Parent:** [0007](0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> 提供一个只编辑青鸟发布配置的 Web 界面。\n> \n> ## Problem\n> \n> 配置目前只能手写文件。\n> \n> ## Goals\n> \n> 界面能读写配置，并拒绝 schema 不接受的值。\n> \n> ## Non-goals\n> \n> 界面不触发 npm publish。不替代 CLI。schema 本身属于 RFC 0010。\n> \n> ## Design\n> \n> 界面单独目录，读取 RFC 0010 的校验结果。不进入 `core/executor.ts`。\n> \n> ## Acceptance\n> \n> 测试保存合法配置与拒绝非法配置。测试不调用发布命令。"},"directory-source-23":{"body":"# .spec/rfc/completed/0022-run-registry-login.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # RFC 0022: Run registry login when publish is unauthenticated (child of 0007)\n> \n> **Status:** Implemented\n> \n> **Parent:** [0007](../0007-qingniao-publish-gaps.md)\n> \n> ## Summary\n> \n> 发布时如果 registry 未登录，青鸟直接运行对应包管理器的 `login`，登录完成后再继续。\n> \n> ## Problem\n> \n> `executePublish` 在 `whoami` 失败时只抛出「请先运行 pnpm login」，用户还要自己再敲一遍命令。\n> \n> ## Goals\n> \n> 交互终端上，未登录时执行 `pnpm login`、`yarn login` 或 `npm login`，然后再次 `whoami`。登录成功则继续发布。登录后仍无用户则失败。\n> \n> ## Non-goals\n> \n> 不保存密码，不绕过 registry 认证。非 TTY 和 `--json` 不启动交互登录。doctor 仍只报告未登录，不在检查时登录。不实现 OTP 配置项。那是 RFC 0014。\n> \n> ## Design\n> \n> 在 `stages/auth.ts` 增加 `ensureNpmAuth`。`core/executor.ts` 用它替换只抛错的分支。登录命令继承 stdio，超时为 0。\n> \n> ## Acceptance\n> \n> 测试覆盖已登录不调用 login、交互时调用 `pnpm login` 后再取用户、非交互时不调用 login、登录后仍失败。"},"directory-source-24":{"body":"# README.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Productivity Tools\n> \n> A collection of development tools used by Systembugtj to build his projects.\n> \n> This monorepo contains various productivity tools and utilities that streamline the development workflow, including publishing tools, documentation generators, and other development automation utilities.\n> \n> ## Packages\n> \n> - **[@systembug/qingniao](./packages/@systembug/qingniao/)**: Universal publish tool for managing releases and versioning.\n> - **[@systembug/pangu](./packages/@systembug/pangu/)**: Interactive development server launcher.\n> - **[@systembug/diting](./packages/@systembug/diting/)**: Documentation and tooling utilities.\n> - **[@systembug/wenxin](./packages/@systembug/wenxin/)**: Universal API documentation generator supporting JSDoc and TypeScript.\n> \n> ## Documentation\n> \n> - 📖 **[在线文档](https://conouch.io/productivity/)** - 完整的工具使用指南\n> - 📖 **[RFCs](.spec/ROADMAP.md)** - Design documents and standards\n> \n> ### 本地查看文档\n> \n> ```bash\n> # 启动文档开发服务器（支持热重载，自动打开浏览器）\n> pnpm run docs\n> # 或\n> pnpm docs:dev\n> \n> # 构建文档（用于 GitHub Pages）\n> pnpm docs:build\n> \n> # 预览构建后的文档\n> pnpm docs:preview\n> ```\n> \n> 启动后会自动打开浏览器，或手动访问：**http://localhost:5173**\n> \n> > **提示**：如果 `pnpm docs` 打开了 npm 网站，请使用 `pnpm run docs` 代替"},"directory-12":{"body":"# packages\n\n## 本目录来源 / Local sources\n\n无已采集来源 / No collected sources\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 4 条已整理规则\n  保护用户暂存工作：执行可能改变 Git 工作区或暂存区的操作前（conditional）\n  RFC 状态反映实际进度：更新 RFC 状态或归档 RFC 时（conditional）\n  测试结论必须附证据：报告测试结果时（conditional）\n  先查根因再修复：处理错误或行为异常时（conditional）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 2 份来源。部分审阅：根目录通用协作、测试声明、RFC 状态规则，以及 UI 技能的适用条件。RFC 正文作为参考资料，不纳入约束图；其余目录级规则与引用缺口未完成语义审阅。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-11":{"body":"# packages/@systembug\n\n## 本目录来源 / Local sources\n\n无已采集来源 / No collected sources\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 4 条已整理规则\n  保护用户暂存工作：执行可能改变 Git 工作区或暂存区的操作前（conditional）\n  RFC 状态反映实际进度：更新 RFC 状态或归档 RFC 时（conditional）\n  测试结论必须附证据：报告测试结果时（conditional）\n  先查根因再修复：处理错误或行为异常时（conditional）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 2 份来源。部分审阅：根目录通用协作、测试声明、RFC 状态规则，以及 UI 技能的适用条件。RFC 正文作为参考资料，不纳入约束图；其余目录级规则与引用缺口未完成语义审阅。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-10":{"body":"# packages/@systembug/qingniao\n\n## 本目录来源 / Local sources\n\n- packages/@systembug/qingniao/README.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 4 条已整理规则\n  保护用户暂存工作：执行可能改变 Git 工作区或暂存区的操作前（conditional）\n  RFC 状态反映实际进度：更新 RFC 状态或归档 RFC 时（conditional）\n  测试结论必须附证据：报告测试结果时（conditional）\n  先查根因再修复：处理错误或行为异常时（conditional）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 2 份来源。部分审阅：根目录通用协作、测试声明、RFC 状态规则，以及 UI 技能的适用条件。RFC 正文作为参考资料，不纳入约束图；其余目录级规则与引用缺口未完成语义审阅。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-25":{"body":"# packages/@systembug/qingniao/README.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # @systembug/qingniao\n> \n> > **相见时难别亦难，东风无力百花残。**\n> > **春蚕到死丝方尽，蜡炬成灰泪始干。**\n> > **晓镜但愁云鬓改，夜吟应觉月光寒。**\n> > **蓬山此去无多路，青鸟殷勤为探看。**\n> > —— 李商隐《无题》\n> \n> 🌌 青鸟 - 零配置优先的通用发布工具，专为 monorepo 项目设计\n> \n> ## 📖 关于这首诗\n> \n> ### 作者简介\n> \n> **李商隐**（约813年—约858年），字义山，号玉溪生，晚唐著名诗人，与杜牧合称\"小李杜\"。他的诗歌以含蓄深沉、意境优美著称，尤其擅长写爱情诗和无题诗，其作品在中国古典诗歌史上占有重要地位。\n> \n> ### 诗歌背景\n> \n> 《无题》是李商隐的代表作之一，创作于晚唐时期。这首诗以\"无题\"命名，体现了李商隐诗歌的典型风格——含蓄隐晦、意境深远。诗中通过\"春蚕\"、\"蜡炬\"等意象，表达了深切的思念和执着的追求。\n> \n> ### 青鸟意象\n> \n> 诗中\"青鸟殷勤为探看\"一句，引用了中国古代神话传说。**青鸟**是西王母的信使，在《山海经》等古籍中多有记载。传说中，青鸟负责为西王母传递消息，是沟通天界与人间的使者。李商隐借用这一意象，表达了对远方之人的思念和期盼，希望青鸟能够代为探看、传递消息。\n> \n> ### 与工具的联系\n> \n> 正如诗中的青鸟殷勤传递消息，青鸟工具也致力于将代码包准确、及时地传递到 NPM 仓库。即使前路遥远（\"蓬山此去无多路\"），青鸟也会殷勤地完成使命（\"青鸟殷勤为探看\"），这正是本工具的设计理念——可靠、优雅、使命必达。\n> \n> ## 📜 项目概述\n> \n> 青鸟是中国神话中西王母的信使，负责将消息和物品准确、及时地传递到人间。正如李商隐《无题》所描绘：\"蓬山此去无多路，青鸟殷勤为探看\"，青鸟工具如诗中的信使一般，殷勤地将您的代码包准确、优雅地传递到 NPM 仓库，即使前路遥远，也必使命必达。\n> \n> `@systembug/qingniao` 是一个**完全零配置优先**的发布工具，自动从 `package.json` 和 workspace 配置推断所有必要信息，让发布流程如青鸟飞行般优雅流畅。\n> \n> ## 🌟 核心特性\n> \n> ### 🎯 零配置优先\n> \n> - **自动检测**：自动检测包管理器、workspace 类型、构建工具\n> - **智能推断**：从项目结构自动推断构建步骤、产物路径、版本策略\n> - **开箱即用**：大多数项目无需配置文件即可使用\n> \n> ### 🚀 深度集成\n> \n> - **pnpm/yarn/npm workspace**：完整支持，自动处理依赖顺序\n> - **Changeset**：深度集成，自动检测和使用 changeset\n> - **Turbo**：自动检测并使用 Turbo 的依赖图\n> - **Git**：自动处理版本提交、标签创建、远程推送\n> \n> ### ⚙️ 灵活配置\n> \n> - **配置文件可选**：仅在需要时覆盖自动检测结果\n> - **部分覆盖**：只需配置需要自定义的部分\n> - **多种格式**：支持 JSON、JavaScript、TypeScript 配置文件\n> \n> ## 🚀 快速开始\n> \n> ### 安装\n> \n> ```bash\n> # 全局安装\n> npm install -g @systembug/qingniao\n> \n> # 或项目本地安装\n> npm install --save-dev @systembug/qingniao\n> ```\n> \n> #### 可选依赖\n> \n> 如果使用 changeset 进行版本管理，需要单独安装 `@changesets/cli`（2 或 3）：\n> \n> Changesets 3 需要 Node.js `^22.11 || ^24 || >=26`。没有待发布 changeset 时，`changeset version` 的退出码 1 视为跳过版本更新。私有包默认不再升版本；要保持 v2 行为，在 `.changeset/config.json` 里设置 `\"privatePackages\": { \"version\": true, \"tag\": false }`。\n> \n> ```bash\n> pnpm add -D @changesets/cli\n> # 或\n> npm install --save-dev @changesets/cli\n> # 或\n> yarn add -D @changesets/cli\n> ```\n> \n> #### 初始化 Changeset\n> \n> 安装 `@changesets/cli` 后，使用以下命令初始化 changeset：\n> \n> ```bash\n> # 使用 qingniao 命令初始化\n> qingniao changeset-init\n> # 或使用简短别名\n> qn ci\n> \n> # 如果 .changeset 目录已存在，使用 --force 强制重新初始化\n> qingniao changeset-init --force\n> ```\n> \n> 这将创建 `.changeset` 目录和配置文件，之后 qingniao 会自动检测并使用 changeset 策略。\n> \n> ### 零配置使用\n> \n> ```bash\n> # 在标准 monorepo 项目中，直接运行：\n> qingniao\n> \n> # 或使用简短命令\n> qn\n> ```\n> \n> 工具会自动：\n> \n> - 检测 pnpm/yarn/npm workspace\n> - 发现所有可发布的包\n> - 检测并使用 changeset（如果存在）\n> - 从 package.json 推断构建步骤\n> - 自动处理版本管理和发布\n> \n> ### Agent / CI 使用\n> \n> `--json` 输出 JSON Lines：stdout 只包含机器事件；原始命令诊断写入 stderr。Agent 不应解析人类文本。\n> \n> ```bash\n> # 无副作用：发现包和将执行的步骤\n> qingniao plan --json\n> \n> # 无副作用：检查认证、Git、scripts 和 changeset\n> qingniao doctor --json\n> \n> # 需要明确授权；没有 --yes 会以退出码 3 停止\n> qingniao --json --yes --dry-run\n> ```\n> \n> 每次 JSON 命令以单个 `result` 事件结束。检查 `exitCode` 与 `status`；错误事件提供稳定 `code` 和可读 `message`。\n> \n> ### 最小配置示例\n> \n> ```json\n> // qingniao.config.json\n> // 只覆盖 Git 分支，其他全部自动检测\n> {\n>     \"git\": {\n>         \"branch\": \"develop\"\n>     }\n> }\n> ```\n> \n> ## 📋 使用示例\n> \n> ### 零配置（推荐）\n> \n> ```bash\n> # 项目结构：\n> # .\n> # ├── .changeset/          # 自动检测 changeset\n> # ├── package.json         # 自动检测包管理器\n> # ├── pnpm-workspace.yaml  # 自动检测 workspace\n> # ├── turbo.json           # 自动检测 turbo\n> # └── packages/\n> #     └── @zouwu-wf/\n> #         └── workflow/\n> \n> # 直接运行，完全依赖自动检测\n> qingniao\n> ```\n> \n> ### 自定义配置\n> \n> ```typescript\n> // qingniao.config.ts\n> import { PublishConfig } from \"@systembug/qingniao\";\n> \n> export default {\n>     // 只覆盖需要自定义的部分\n>     git: {\n>         branch: \"main\",\n>         tagPrefix: \"v\",\n>     },\n>     build: {\n>         steps: [{ name: \"自定义构建\", command: \"pnpm build:custom\" }],\n>     },\n>     // 其他配置保持自动检测\n> };\n> ```\n> \n> ## 🔧 核心功能\n> \n> ### 版本管理\n> \n> - **Changeset 集成**：自动检测和使用 changeset\n> - **手动版本**：支持 major/minor/patch 手动选择\n> - **版本同步**：自动同步所有 workspace 包的版本\n> - **Workspace 协议**：自动替换 `workspace:*` 为实际版本\n> \n> ### 构建验证\n> \n> - **自动推断**：从 package.json scripts 自动生成构建步骤\n> - **产物验证**：自动检测和验证构建产物\n> - **依赖顺序**：按依赖关系拓扑排序构建\n> - **Pre-lint 构建**：支持在 lint 之前构建特定包（如 eslint-plugin）\n> \n> ### NPM 发布\n> \n> - **智能发布**：按依赖顺序发布包\n> - **Dry-run 支持**：发布前验证\n> - **OTP 支持**：自动处理 2FA 认证\n> - **错误处理**：详细的错误信息和恢复建议\n> \n> ## 📚 配置参考\n> \n> ### 完整配置示例\n> \n> ```typescript\n> import { PublishConfig } from \"@systembug/qingniao\";\n> \n> const config: PublishConfig = {\n>     project: {\n>         name: \"My Project\",\n>         packageManager: \"pnpm\",\n>     },\n>     git: {\n>         branch: \"main\",\n>         tagPrefix: \"v\",\n>     },\n>     version: {\n>         strategy: \"changeset\",\n>         syncAll: true,\n>     },\n>     build: {\n>         steps: [\n>             { name: \"安装依赖\", command: \"pnpm install --frozen-lockfile\" },\n>             { name: \"代码检查\", command: \"pnpm lint\" },\n>             { name: \"类型检查\", command: \"pnpm typecheck\" },\n>             { name: \"测试\", command: \"pnpm test\" },\n>             { name: \"构建\", command: \"turbo build\" },\n>         ],\n>     },\n>     publish: {\n>         skipExisting: true,\n>     },\n> };\n> \n> export default config;\n> ```\n> \n> ## 🎨 青鸟哲学\n> \n> 正如古诗所描绘的，青鸟作为信使具有以下特质：\n> \n> - **殷勤**：主动检测和推断，无需繁琐配置\n> - **可靠**：确保版本同步、依赖正确、构建完整\n> - **优雅**：提供流畅的发布体验，如青鸟飞行般优雅\n> - **智能**：自动处理复杂逻辑，让开发者专注于代码\n> \n> ## 📖 相关文档\n> \n> - [RFC 0001: 青鸟通用发布工具设计规范](../../../.spec/rfc/0001-universal-publish-tool.md)\n> - [零配置指南](./docs/zero-config.md)\n> - [配置参考](./docs/configuration.md)\n> - [API 文档](./docs/api.md)\n> \n> ## 🤝 贡献指南\n> \n> 欢迎贡献代码、报告问题或提出建议！\n> \n> 1. Fork 项目\n> 2. 创建特性分支 (`git checkout -b feature/amazing-feature`)\n> 3. 提交更改 (`git commit -m 'Add amazing feature'`)\n> 4. 推送到分支 (`git push origin feature/amazing-feature`)\n> 5. 开启 Pull Request\n> \n> ## 📄 许可证\n> \n> MIT License - 详见 [LICENSE](./LICENSE) 文件\n> \n> ---\n> \n> > **相见时难别亦难，东风无力百花残。**\n> > **春蚕到死丝方尽，蜡炬成灰泪始干。**\n> > **晓镜但愁云鬓改，夜吟应觉月光寒。**\n> > **蓬山此去无多路，青鸟殷勤为探看。**\n> > —— 李商隐《无题》\n> \n> 让代码发布如青鸟传递消息般优雅流畅！"},"directory-14":{"body":"# docs\n\n## 本目录来源 / Local sources\n\n无已采集来源 / No collected sources\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 4 条已整理规则\n  保护用户暂存工作：执行可能改变 Git 工作区或暂存区的操作前（conditional）\n  RFC 状态反映实际进度：更新 RFC 状态或归档 RFC 时（conditional）\n  测试结论必须附证据：报告测试结果时（conditional）\n  先查根因再修复：处理错误或行为异常时（conditional）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 2 份来源。部分审阅：根目录通用协作、测试声明、RFC 状态规则，以及 UI 技能的适用条件。RFC 正文作为参考资料，不纳入约束图；其余目录级规则与引用缺口未完成语义审阅。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-13":{"body":"# docs/tools\n\n## 本目录来源 / Local sources\n\n- docs/tools/qingniao.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 4 条已整理规则\n  保护用户暂存工作：执行可能改变 Git 工作区或暂存区的操作前（conditional）\n  RFC 状态反映实际进度：更新 RFC 状态或归档 RFC 时（conditional）\n  测试结论必须附证据：报告测试结果时（conditional）\n  先查根因再修复：处理错误或行为异常时（conditional）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 2 份来源。部分审阅：根目录通用协作、测试声明、RFC 状态规则，以及 UI 技能的适用条件。RFC 正文作为参考资料，不纳入约束图；其余目录级规则与引用缺口未完成语义审阅。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-26":{"body":"# docs/tools/qingniao.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # 青鸟 (Qingniao)\n> \n> > **相见时难别亦难，东风无力百花残。**\n> > **春蚕到死丝方尽，蜡炬成灰泪始干。**\n> > **晓镜但愁云鬓改，夜吟应觉月光寒。**\n> > **蓬山此去无多路，青鸟殷勤为探看。**\n> > —— 李商隐《无题》\n> \n> 🌌 青鸟 - 零配置优先的通用发布工具，专为 monorepo 项目设计\n> \n> ## 📖 关于青鸟\n> \n> 青鸟是中国神话中西王母的信使，负责将消息和物品准确、及时地传递到人间。正如李商隐《无题》所描绘：\"蓬山此去无多路，青鸟殷勤为探看\"，青鸟工具如诗中的信使一般，殷勤地将您的代码包准确、优雅地传递到 NPM 仓库，即使前路遥远，也必使命必达。\n> \n> ## ✨ 核心特性\n> \n> ### 🎯 零配置优先\n> \n> - **自动检测**：自动检测包管理器、workspace 类型、构建工具（Turbo/Nx）\n> - **智能推断**：从项目结构自动推断构建步骤、产物路径、版本策略\n> - **开箱即用**：大多数项目无需配置文件即可使用\n> \n> ### 🚀 深度集成\n> \n> - **pnpm/yarn/npm workspace**：完整支持，自动处理依赖顺序\n> - **Changeset**：深度集成，自动检测和使用 changeset\n> - **Turbo/Nx**：自动检测并使用构建工具的依赖图\n> - **Git**：自动处理版本提交、标签创建、远程推送\n> \n> ### ⚙️ 灵活配置\n> \n> - **配置文件可选**：仅在需要时覆盖自动检测结果\n> - **部分覆盖**：只需配置需要自定义的部分\n> - **多种格式**：支持 JSON、JavaScript、TypeScript 配置文件\n> \n> ## 📦 安装\n> \n> ```bash\n> # 全局安装\n> npm install -g @systembug/qingniao\n> \n> # 或项目本地安装\n> pnpm add -D @systembug/qingniao\n> # 或\n> npm install --save-dev @systembug/qingniao\n> # 或\n> yarn add -D @systembug/qingniao\n> ```\n> \n> ### 可选依赖\n> \n> 如果使用 changeset 进行版本管理，需要单独安装 `@changesets/cli`：\n> \n> ```bash\n> pnpm add -D @changesets/cli\n> ```\n> \n> ## 🚀 快速开始\n> \n> ### 零配置使用（推荐）\n> \n> 在标准 monorepo 项目中，直接运行：\n> \n> ```bash\n> qingniao\n> # 或使用简短命令\n> qn\n> ```\n> \n> 工具会自动：\n> \n> - 检测 pnpm/yarn/npm workspace\n> - 发现所有可发布的包（自动排除私有包）\n> - 检测并使用 changeset（如果存在）\n> - 从 package.json 推断构建步骤\n> - 自动处理版本管理和发布\n> \n> ### 在 package.json 中添加脚本\n> \n> ```json\n> {\n>     \"scripts\": {\n>         \"release\": \"qingniao\",\n>         \"release:dry-run\": \"qingniao --dry-run\"\n>     }\n> }\n> ```\n> \n> 然后运行：\n> \n> ```bash\n> pnpm release\n> ```\n> \n> ## 🎯 零配置自动检测\n> \n> 青鸟工具会自动检测以下信息，**无需任何配置文件**：\n> \n> ```mermaid\n> graph LR\n>     A[项目根目录] --> B[检测包管理器]\n>     A --> C[检测 Workspace]\n>     A --> D[检测构建工具]\n>     A --> E[检测版本策略]\n>     A --> F[发现包列表]\n> \n>     B --> G[package.json\u003cbr/>packageManager]\n>     C --> H[pnpm-workspace.yaml\u003cbr/>或 package.json workspaces]\n>     D --> I[turbo.json\u003cbr/>或 nx.json]\n>     E --> J[.changeset 目录]\n>     F --> K[pnpm list\u003cbr/>或模式匹配]\n> \n>     G --> L[自动配置]\n>     H --> L\n>     I --> L\n>     J --> L\n>     K --> L\n> \n>     style A fill:#e3f2fd\n>     style L fill:#c8e6c9\n> ```\n> \n> ### 自动检测项\n> \n> - ✅ **包管理器**：从 `package.json` 的 `packageManager` 字段检测\n> - ✅ **Workspace 类型**：从 `pnpm-workspace.yaml`、`package.json` workspaces 自动检测\n> - ✅ **包列表**：使用包管理器命令自动发现所有包\n> - ✅ **包过滤**：自动排除私有包（`private: true`）和无效配置的包\n> - ✅ **版本策略**：检测 `.changeset` 目录，自动选择 changeset 或 manual 策略\n> - ✅ **构建工具**：从 `turbo.json` 或 `nx.json` 自动检测 Turbo/Nx\n> - ✅ **构建步骤**：从 `package.json` scripts 自动生成构建步骤\n> - ✅ **构建产物路径**：从每个包的 `package.json` 自动推断（main/module/types 字段）\n> - ✅ **Git 分支**：自动检测当前分支\n> - ✅ **依赖顺序**：自动分析 workspace 依赖关系，拓扑排序\n> \n> ### 包发布验证\n> \n> 青鸟会自动验证每个包的发布配置：\n> \n> - ✅ 检查是否为私有包（自动排除）\n> - ✅ 对于 scoped packages（如 `@systembug/xxx`），检查 `publishConfig.access` 是否为 `\"public\"`\n> - ✅ 显示详细的验证错误和警告\n> \n> ## 📋 发布流程\n> \n> 青鸟的发布流程如下：\n> \n> ```mermaid\n> flowchart TD\n>     A[开始发布] --> B[环境检查]\n>     B --> C{NPM 认证}\n>     C -->|未登录| D[提示登录]\n>     C -->|已登录| E[Git 状态检查]\n>     E --> F{工作区干净?}\n>     F -->|否| G[提示提交更改]\n>     F -->|是| L[发布前验证]\n>     L --> M[安装依赖]\n>     M --> N[lint / Prettier / typecheck / test]\n>     N --> O[构建所有包]\n>     O --> P[验证构建产物]\n>     P --> H[版本管理]\n>     H --> I{需要更新版本?}\n>     I -->|是| J[选择版本类型]\n>     J --> K[更新所有包版本]\n>     I -->|否| S[发布到 NPM]\n>     K --> Q[格式化并提交 / 打标签]\n>     Q --> S\n>     S --> T[完成]\n> \n>     style A fill:#e1f5ff\n>     style T fill:#c8e6c9\n>     style D fill:#ffcdd2\n>     style G fill:#ffcdd2\n> ```\n> \n> ### 详细步骤\n> \n> 1. **环境检查**\n>     - NPM 认证检查\n>     - Git 状态检查（工作区干净）\n>     - 远程同步检查\n> \n> 2. **发布前验证**（在版本号更新与 Git 标签之前）\n>     - 安装依赖\n>     - 代码检查（ESLint）\n>     - 格式检查（Prettier `format:check`）\n>     - 类型检查（TypeScript）\n>     - 运行测试\n>     - 构建所有包（Turbo/Nx）\n>     - 验证构建产物\n> \n> 3. **版本管理**（可选）\n>     - 选择版本类型（major/minor/patch）\n>     - 更新所有包的版本号（包括根目录）\n>     - 同步 workspace 依赖版本\n>     - 提交到 Git 并创建标签\n> \n> 4. **发布到 NPM**\n>     - 显示将要发布的包列表\n>     - 检查已存在的版本\n>     - Dry-run 测试（可选）\n>     - 正式发布\n> \n> ## 🎯 使用示例\n> \n> ### 基本发布\n> \n> ```bash\n> # 1. 确保代码已提交\n> git add .\n> git commit -m \"feat: 新功能\"\n> \n> # 2. 运行发布\n> pnpm release\n> \n> # 3. 按照提示操作\n> # - 选择是否更新版本\n> # - 选择     activity: ["\u672C\u6B21\u4FEE\u6539", "\u4EAE\u8D77\u7684\u662F\u6240\u9009\u6B65\u9AA4\u7684\u76EE\u6807\uFF0C\u7070\u8272\u6A21\u5757\u4E0D\u662F\u5F53\u524D\u76EE\u6807\uFF1B\u9A8C\u8BC1\u9636\u6BB5\u7684\u4EAE\u8D77\u8868\u793A\u9A8C\u8BC1\u76EE\u6807\u3002\u7EC8\u6001\u4E0D\u518D\u9AD8\u4EAE\u76EE\u6807\u3002", "Current changes", "Bright modules are targets of the selected step; gray modules are not. During verification, highlights mean verification targets. Terminal steps clear highlights."],
    compare: ["\u540C\u65F6\u5BF9\u7167", "\u5B8C\u6574\u67B6\u6784\u4E0E\u66F4\u6539\u89C6\u56FE\u5E76\u6392\u5C55\u793A\uFF0C\u9009\u62E9\u3001\u7F29\u653E\u548C\u6EDA\u52A8\u4FDD\u6301\u8054\u52A8\u3002\u7A84\u5C4F\u65F6\u4E0A\u4E0B\u6392\u5217\u3002", "Compare views", "Compare architecture and changes with linked selection, zoom and scrolling. Narrow screens stack the views."],
    details: ["\u67E5\u770B\u4F9D\u636E", "\u70B9\u51FB\u6A21\u5757\u53EF\u67E5\u770B\u804C\u8D23\u3001\u6587\u4EF6\u5F52\u5C5E\u4E0E\u6E90\u7801\u8BC1\u636E\u3002\u60AC\u6D6E\u6A21\u5757\u53EF\u8FFD\u8E2A\u76F4\u63A5\u8FDE\u63A5\uFF0C\u5DE5\u5177\u680F\u53EF\u5207\u6362\u5168\u90E8\u5173\u7CFB\u6216\u9002\u914D\u5168\u56FE\u3002", "Inspect evidence", "Select a module for responsibilities, file ownership and source evidence. Hover to trace direct connections; use the toolbar for all relations or fit to view."],
    history: ["\u8DDF\u8E2A\u8FC7\u7A0B", "\u5386\u53F2\u8BB0\u5F55\u5C55\u793A\u8BA1\u5212\u3001\u7F16\u8F91\u548C\u9A8C\u8BC1\u6B65\u9AA4\u3002\u5C55\u5F00\u8BE6\u60C5\u67E5\u770B\u6587\u4EF6\u548C\u68C0\u67E5\u7ED3\u679C\uFF1B\u4EFB\u52A1\u5B8C\u6210\u4E0D\u4EE3\u8868\u68C0\u67E5\u901A\u8FC7\u3002", "Follow progress", "History shows planning, editing and verification steps. Expand details for files and check results; completion alone does not prove checks passed."]
  };
  var guideIndex = 0;
  var guideSaved;
  var guideTarget;
  var guideFrame = 0;
  var guideViewState = {
    architecture: { mode: "architecture", inspector: false, history: false },
    activity: { mode: "activity", inspector: false, history: false },
    compare: { mode: "compare", inspector: false, history: false },
    details: { mode: "architecture", inspector: true, history: false },
    history: { mode: "activity", inspector: false, history: true }
  };
  function guideLabels() {
    const zh = isChinese2();
    guideLaunch.textContent = zh ? "\u4F7F\u7528\u6307\u5F15" : "Guide";
    query("span", guideInvite).textContent = zh ? "\u4E86\u89E3\u600E\u4E48\u770B\u56FE" : "Learn to read the map";
    $("guide-start").textContent = zh ? "\u5F00\u59CB" : "Start";
    $("guide-dismiss").textContent = zh ? "\u6682\u4E0D" : "Not now";
    for (const [id, labels] of Object.entries({ "guide-close": ["\u5173\u95ED\u6307\u5F15", "Close guide"], "guide-prev": ["\u4E0A\u4E00\u6B65", "Previous"], "guide-skip": ["\u8DF3\u8FC7\u6307\u5F15", "Skip guide"] })) {
      $(id).ariaLabel = required(labels[zh ? 0 : 1]);
      if (id !== "guide-close") $(id).textContent = required(labels[zh ? 0 : 1]);
    }
    const copy = guideCopy[required(guideSteps[guideIndex])];
    $("guide-title").textContent = copy[zh ? 0 : 2];
    $("guide-copy").textContent = copy[zh ? 1 : 3];
    $("guide-count").textContent = zh ? `\u7B2C ${guideIndex + 1} / ${guideSteps.length} \u6B65` : `Step ${guideIndex + 1} of ${guideSteps.length}`;
    $("guide-progress").max = guideSteps.length;
    $("guide-progress").value = guideIndex + 1;
    $("guide-progress").ariaLabel = $("guide-count").textContent;
    buttonById("guide-prev").disabled = guideIndex === 0;
    $("guide-next").textContent = guideIndex === guideSteps.length - 1 ? zh ? "\u5B8C\u6210" : "Done" : zh ? "\u4E0B\u4E00\u6B65" : "Next";
  }
  function positionGuide() {
    if (!guideDialog.open || !guideTarget) return;
    const rect = guideTarget.getBoundingClientRect();
    const w = innerWidth, h = innerHeight;
    const left = Math.max(6, Math.min(w - 12, rect.left - 5));
    const top = Math.max(6, Math.min(h - 12, rect.top - 5));
    const right = Math.max(left + 6, Math.min(w - 6, rect.right + 5));
    const bottom = Math.max(top + 6, Math.min(h - 6, rect.bottom + 5));
    Object.assign($("guide-spot").style, { left: `${left}px`, top: `${top}px`, width: `${right - left}px`, height: `${bottom - top}px` });
    const card = $("guide-card");
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let x = left, y = bottom + 14;
    if (y + ch > h - 12) {
      if (top - ch - 14 >= 12) y = top - ch - 14;
      else if (right + cw + 14 < w - 12) {
        x = right + 14;
        y = top;
      } else {
        x = w - cw - 12;
        y = h - ch - 12;
      }
    }
    card.style.left = `${Math.max(12, Math.min(w - cw - 12, x))}px`;
    card.style.top = `${Math.max(12, Math.min(h - ch - 12, y))}px`;
  }
  function showGuideStep() {
    const saved = required(guideSaved);
    const step = required(guideSteps[guideIndex]);
    const state = guideViewState[step];
    hoveredModuleId = void 0;
    setInspector(state.inspector);
    activityMode = state.mode;
    if (step === "activity") {
      const plan = activityEvents.findIndex((event) => event.phase === "planned" && event.targets.length);
      activityIndex = plan >= 0 ? plan : saved.index;
    } else activityIndex = saved.index;
    $("activity-disclosure").open = state.history;
    fitting = true;
    updateActivity();
    updateFlow();
    updateZoom();
    if (step === "details") select(map.modules.find((module) => module.id === saved.selected) || required(map.modules[0]));
    guideTarget = step === "details" ? inspector : step === "history" ? activityPanel : step === "compare" ? $("activity-mode") : step === "activity" ? viewport : activityEvents.length ? query('[data-view="architecture"]') : viewport;
    guideTarget.scrollIntoView({ block: "nearest", behavior: "instant" });
    guideLabels();
    positionGuide();
    requestAnimationFrame(positionGuide);
    $("guide-next").focus({ preventScroll: true });
  }
  function dismissGuideInvite() {
    guideInvite.hidden = true;
    try {
      localStorage.setItem(guideKey, "seen");
    } catch {
    }
  }
  function startGuide() {
    if (guideDialog.open) return;
    dismissGuideInvite();
    guideSaved = { mode: activityMode, index: activityIndex, selected: selectedModuleId, inspector: workspace.classList.contains("inspector-open"), zoom, fitting, disclosure: $("activity-disclosure").open, focus: document.activeElement, x: scrollX, y: scrollY, constraints: { open: constraintPanelOpen, selected: selectedConstraintId, filter: constraintFilter }, panes: [...mapPanes.querySelectorAll(".map-scroll")].map((el) => [el, el.scrollLeft, el.scrollTop]) };
    guideIndex = 0;
    constraintPanelOpen = false;
    guideDialog.showModal();
    showGuideStep();
  }
  function finishGuide() {
    if (!guideDialog.open) return;
    guideDialog.close();
    const saved = required(guideSaved);
    activityMode = saved.mode;
    activityIndex = saved.index;
    constraintPanelOpen = saved.constraints.open;
    selectedConstraintId = saved.constraints.selected;
    constraintFilter = saved.constraints.filter;
    fitting = false;
    setInspector(saved.inspector);
    $("activity-disclosure").open = saved.disclosure;
    updateActivity();
    select(map.modules.find((module) => module.id === saved.selected) || required(map.modules[0]));
    zoom = saved.zoom;
    updateZoom();
    fitting = saved.fitting;
    for (const [el, x, y] of saved.panes) el.scrollTo(x, y);
    window.scrollTo(saved.x, saved.y);
    (saved.focus instanceof HTMLElement && saved.focus.isConnected && !saved.focus.closest("#guide-invite") ? saved.focus : guideLaunch).focus({ preventScroll: true });
  }
  guideLaunch.onclick = $("guide-start").onclick = startGuide;
  $("guide-dismiss").onclick = dismissGuideInvite;
  $("guide-close").onclick = $("guide-skip").onclick = finishGuide;
  $("guide-prev").onclick = () => {
    if (guideIndex) {
      guideIndex--;
      showGuideStep();
    }
  };
  $("guide-next").onclick = () => {
    if (guideIndex === guideSteps.length - 1) finishGuide();
    else {
      guideIndex++;
      showGuideStep();
    }
  };
  guideDialog.addEventListener("cancel", (event) => {
    event.preventDefault();
    finishGuide();
  });
  languageSelect.addEventListener("change", () => {
    guideLabels();
    positionGuide();
  });
  var repositionGuide = () => {
    cancelAnimationFrame(guideFrame);
    guideFrame = requestAnimationFrame(positionGuide);
  };
  window.addEventListener("resize", repositionGuide);
  document.addEventListener("scroll", repositionGuide, true);
  new ResizeObserver(repositionGuide).observe($("guide-card"));
  guideLabels();
  if (DATA.constraintView) {
    const view = DATA.constraintView;
    const main = query("body > main");
    const nav = document.createElement("nav");
    nav.id = "project-views";
    const architecture = document.createElement("button");
    const constraints = document.createElement("button");
    architecture.type = constraints.type = "button";
    nav.append(architecture, constraints);
    query("header .task").after(nav);
    main.id = "architecture-view";
    architecture.setAttribute("aria-controls", main.id);
    const panel = document.createElement("section");
    panel.id = "constraint-view";
    panel.hidden = true;
    constraints.setAttribute("aria-controls", panel.id);
    main.after(panel);
    const related = document.createElement("button");
    related.id = "open-related-constraints";
    related.type = "button";
    $("module-content").append(related);
    let active = false;
    let canvas;
    const label = (zh, en) => isChinese2() ? zh : en;
    const sync = () => {
      nav.setAttribute("aria-label", label("\u9879\u76EE\u89C6\u56FE", "Project views"));
      architecture.textContent = label("\u67B6\u6784", "Architecture");
      constraints.textContent = label("\u7EA6\u675F", "Constraints");
      architecture.setAttribute("aria-pressed", String(!active));
      constraints.setAttribute("aria-pressed", String(active));
      const count = view.rules.filter((rule) => rule.modules.includes(selectedModuleId ?? "")).length;
      related.textContent = count ? label(`\u67E5\u770B\u5173\u8054\u7EA6\u675F\u56FE \xB7 ${count}`, `View related rules \xB7 ${count}`) : label("\u5C1A\u672A\u8BB0\u5F55\u6A21\u5757\u4E0E\u89C4\u5219\u7684\u5173\u8054", "No module-rule links recorded");
      related.disabled = !count;
    };
    const show = (value) => {
      active = value;
      main.hidden = value;
      panel.hidden = !value;
      if (value && !canvas) canvas = mountConstraintCanvas(panel, view.graph);
      const hash = new URLSearchParams(location.hash.slice(1));
      hash.set("view", value ? "constraints" : "architecture");
      try {
        history.replaceState(null, "", `#${hash}`);
      } catch {
      }
      sync();
      requestAnimationFrame(() => canvas?.resize());
      window.dispatchEvent(new Event("resize"));
    };
    architecture.onclick = () => show(false);
    constraints.onclick = () => show(true);
    related.onclick = () => {
      show(true);
      canvas?.filter(view.rules.filter((rule) => rule.modules.includes(selectedModuleId ?? "")).map((rule) => rule.id));
    };
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    new MutationObserver(sync).observe($("module-constraints"), { childList: true, subtree: true });
    show(new URLSearchParams(location.hash.slice(1)).get("view") === "constraints");
  }
})();
</script>
</body>
</html>
